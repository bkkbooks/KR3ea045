body:
  text: 卷九痰飲門痰飲總論夫嗽者五臟皆有嗽皆因內傷脾胃外感風邪皮毛屬肺風寒隨玄府而入腠理開張內外相合先傳肺而入遂成咳嗽乃肺寒也寒化熱熱則生痰喘滿也經云喉中介介介如梗狀甚則嗽血也胸滿氣喘痰盛稠黏皆肺氣熱也大人參半夏丸化痰墜涎止嗽定喘治諸痰不可盡述嘔吐痰逆痰厥頭痛風氣偏正頭疼風壅頭目昏眩耳鳴鼻塞咽膈不利心腹痞滿筋脈拘卷肢體麻痹疼痛中風偏枯咳唾稠黏肺痿勞嗽虛人保養宣通氣血調和臟腑進飲食人參茯苓去皮天南星薄荷葉各半兩半夏乾生薑白礬生寒水石各一兩蛤粉一兩藿香葉一分上為末麵糊為丸如小豆大生薑湯下二三十丸食後溫水亦得一法加黃連半兩黃柏二兩水丸取效愈妙治酒病調和臟腑尤宜服之半夏栝蔞丸新添治遠近痰嗽煩喘不止者半夏生薑制栝蔞杏仁去皮尖白礬枯杵款冬花各等分上為末生薑汁打麵糊為丸如桐子大每服二十丸煎生薑湯下不計時候白朮厚朴湯治痰飲嘔吐利胸膈除寒熱美飲食白朮甘草炙葛根各一兩厚朴半兩上件為末每服一二錢水一大盞生薑五片煎至六分去滓食前服顯仁丸仙術芎散大人參半夏丸橘皮半夏湯治痰壅涎嗽久不已者常服養液潤燥解肌熱止咳嗽橘皮半兩去白半夏二錢半湯洗七次上為末分作二服每服水一盞半入生薑十片同煎至七分去滓溫服知母茯苓湯治肺痿喘咳不已往來寒熱自汗茯苓去皮甘草各一兩知母五味子人參薄荷半夏洗七次柴胡白朮款冬花桔梗麥門冬黃芩各半兩川芎三錢阿膠三錢炒上為末每服三錢水一盞半生薑十片同煎至七分去滓稍熱服人參潤肺湯治肺氣不足喘急咳嗽不已並傷寒頭疼憎寒壯熱四肢疼痛人參桔梗白芷麻黃去節乾葛白朮甘草炙各一兩白薑半兩上為末每服二錢水一大盞生薑三片蔥白二寸煎至八分如出汗連進二服通口溫服杏仁半夏湯治肺痿涎喘不定咳嗽不已及甚者往來寒熱杏仁去皮桔梗陳皮去白茯苓去皮漢防己白礬桑白皮各三錢薄荷葉一錢甘草二寸豬牙皂角一錢上為末作二服水二盞生薑三片煎至六分去滓食後溫服防己丸治肺不足喘嗽久不已者調順氣血消化痰涎防己二錢杏仁三兩木香二錢上為末煉蜜為丸如小豆大每服二十丸煎桑白皮湯下如大便閟加葶藶一兩食後服葶藶散治肺氣喘滿痰嗽眠臥不安不思飲食苦葶藶蛤粉各三錢桑白皮山梔子人參荊芥穗薄荷葉赤茯苓去皮陳皮桔梗杏仁甘草各半兩上為末每服三錢水一大盞入生薑三片煎至六分去滓溫服食後保安半夏丸治久新諸嗽或上逆涎喘短氣痰鳴咽乾煩渴大小便澀滯肺痿勞劣心腹痞滿急痛中滿隔氣上實下虛酒食積聚不消補養氣血宣行營衛半夏天南星各半兩牽牛二兩大黃半兩黃柏一兩半蛤粉一兩巴豆四個上為末水為丸如小豆大每服十丸十五丸溫水下食後日三服孕婦不可服又方無巴豆有乾薑一錢半人參保肺湯治五勞七傷喘氣不接涎痰稠黏骨蒸潮熱人參柴胡當歸芍藥桑白皮知母白朮川芎黃耆紫菀荊芥地骨皮各一分茯苓去皮黃芩連翹大黃薄荷各半兩山梔子同甘草桔梗各一兩石膏滑石寒水石各半兩上為末每服三錢水一盞生薑三片煎至七分去滓溫服泄者去大黃同人參半夏丸服神應丹治涎嗽喘滿上攻心腹卒痛及利下血兼婦人帶下病一切肋脅痛滿薄荷葉甘草各四錢巴豆燈燒存性盆硝各二錢輕粉一錢豆豉一兩慢火炒五靈脂二錢上為末煉蜜為丸如桐子大每服一丸溫齏汁下續後空咽津三五次禁飲食少時覺咽喉微暖效心腹急痛溫酒下二丸未效再服得利尤良帶下以溫酒下二丸或大便流利再服人參散治身熱頭痛積熱黃瘦肌熱惡寒蓄熱發戰膈熱嘔吐煩渴濕熱瀉利或目赤口瘡咽喉腫痛或風昏眩虛汗肺痿勞嗽不已者石膏甘草各一兩滑石四兩寒水石二兩人參半兩上為末每服二錢溫水調下早晚食後兼服梔子金花丸一名既濟解毒丹寧神散治一切痰嗽不已者諸藥無效世傳極驗御米囊一斤生醋炒烏梅四兩上為末每服二三錢沸湯點服食後日三服賈同知方御米殼一兩炒烏梅肉半兩依前法服之康少伊傳煎烏梅湯尤妙桂苓白朮丸消痰逆止咳嗽散痞滿壅塞開堅結痛悶推進飲食調和臟腑無問寒濕濕熱嘔吐瀉利皆能開發以令遍身流濕潤燥氣液宣平而愈解酒毒療肺痿勞嗽水腫腹脹瀉利不能止者服之利止為度隨證調之楝桂乾生薑各一分茯苓去皮半夏各一兩白朮紅皮去白澤瀉各半兩上為末麵糊為丸如小豆大生薑湯下二三十丸日三服病在膈上食後在下食前在中不計時候或一法更加黃連半兩黃柏二兩水丸取效愈妙潤肺散治小兒膈熱咳嗽痰喘甚者久不瘥者栝蔞實一枚去子用上為末以寒食麵和為餅子炙黃為末每服一錢溫水化乳糖下日三服效乃止又方治寒嗽麻黃四兩官桂一兩蠟二錢上為末以蠟同煎每服一二錢溫服寧肺散治一切寒熱痰盛久新咳嗽不止者御米殼四兩木瓜三兩御米殼一處用蜜二兩水化同炒微黃五味子一兩人參一兩皂角二兩上為末每服二錢烏梅同煎臨臥食後服大效鱉甲丸治吐血咳嗽神效鱉甲一個九肋者醋炙黃柴胡一兩醋浸一宿杏仁一兩童子小便浸炒甘遂一兩炙人參半兩上為末煉蜜為丸如桐子大每服十丸至十五丸生薑湯下又方用厚朴一兩生薑制石膏散治熱嗽喘甚者石膏一兩甘草半兩炙上為末每服三錢新汲水下又生薑汁蜜調下人參半夏丸治一切痰飲喘嗽不已白礬天南星半夏各半兩甘草二錢半炙人參二錢赤小豆四十九粒杏仁四十九粒豬牙皂角一錢上為末秫米三合醋一升熬粥和丸如桐子大每服十五丸炒蘿蔔子湯臨臥下仙人肢丸治遠年勞嗽不問寒熱痰涎喘滿先服松花膏下過多服此藥無不效人參沙參玄參紫團參丹參白朮牡蠣知母甘草各二兩蛤蚧一對頭尾全用河水淨洗文武火酥炙黃色上為末用麻黃十五斤去根枸杞子三斤熬成膏丸如彈子大磁合子內盛臨臥煎生薑自然汁化下一丸小兒量歲數加減松花膏治三十年勞嗽預九月間宣利一切痰涎肺積喘嗽不利防風乾生薑野菊花芫花枸杞子甘草蒼朮黃精各等分上為末取黃精根熬成膏子和藥末如彈子大每服細嚼一丸冷水化下臨臥不吃夜飯服藥一粒辰砂半夏丸治小兒肺壅痰實咳嗽喘急胸膈痞滿心忪煩悶痰涎不利呀呷有聲半夏半兩洗葶藶水研成膏杏仁炒研成膏各半兩硃砂五靈脂微炒各一兩上為末更研勻生薑汁煮麵糊為丸如桐子大每服十五丸生薑湯下大百勞散治一切勞疾肌劣喘息不臥痰涎不食蛤蚧一對蜜炙元州鱉甲一個去裙醋炙附子一兩人參柴胡川乾薑白茯苓去皮白朮茴香青皮去白杏仁去皮尖知母貝母陳皮去白官桂甘草炙半夏生薑制蒼朮湯浸各一兩蘇木龍膽草各半兩上為末每服二錢水一盞用生薑三片棗二枚烏梅二枚同煎空心稍熱服有汗加小麥二十粒不用鐵煎小百勞散治勞喘嗽不已自汗者御米殼不拘多少炒上為末每服二錢入烏梅同煎水一盞溫服食後有汗加小麥三十粒同煎溫服五味子湯治胸膈痞滿心腹刺痛短氣噎悶咳嗽痰唾嘔逆噁心不思飲食溫中益氣五味子九兩良薑一兩半紅皮去白茴香炒各一兩乾薑一兩半甘草七兩炙鹽一斤炒上為細末每服一錢百沸湯點空心食前甚者日進三服安神散治遠年近日喘嗽不已御米殼蜜炒一兩人參陳皮去白甘草炙各一兩上為末每服一錢煎烏梅湯調下臨臥服勞門白朮黃耆散治五心煩自汗四肢痿劣飲食減少肌瘦昏昧白朮黃耆當歸黃芩去皮芍藥各半兩石膏甘草各二兩茯苓寒水石各一兩官桂一分人參川芎各三分上為末每服三錢水一盞煎至六分去滓溫服食前一日三服人參白朮湯方在燥門第一方是也此乃為同不復録耳黃連丸治濕熱流連氣血不通壅滯不散清爽頭目黃連好者不拘多少上為末酒麵糊為丸如小豆大每服二十丸溫水下不計時候日三服必效散治五勞七傷勞役肌瘦不思飲食喘嗽不已川烏頭一兩生天南星半兩生上為末每服二錢蘿蔔八塊如拇指大以水煮熟去滓食後服嚼當歸地黃湯治嗽血衄血大小便血或婦人經候不調月水過多喘嗽者當歸芍藥川芎白朮染槐子黃藥子各半兩生地黃甘草茯苓去皮黃芩白龍骨各一兩上為末每服三錢水一盞煎至七分去滓溫服食前紫菀散治勞體熱心寒脈滑短咳嗽婦人多有此疾口乾眼澀骨痿短氣皆因腸胃燥滯營衛不能開發玄府閉塞熱鬱內余可以開發陰陽宣通澀滯和營衛順三焦兼服人參白朮湯紫菀桑白皮桔梗續斷甘草五味子各一兩赤小豆一合上為末水一大盞藥末五錢青竹茹彈子大同煎至七分溫服去滓枳實飲子治婦人手足煩熱夜臥多汗肌肉黃瘁經候不調四肢煩倦心腹滿悶狀似勞氣枳實二兩半夏一兩湯洗七次生薑汁浸二日火炒黃色用半夏紅芍藥柴胡各一兩黃芩一兩半上為末每服二錢水一盞生薑三片棗二枚同煎至八分去滓溫服及治五心煩熱及身體壯熱潮熱續服桃仁煎丸又治月經不調阻滯不通桃仁二兩湯浸火炒川大黃川朴硝各二兩虻蟲一兩去翅頭足上為末用醋五升入金銀鐺內以慢火熬成膏可丸如桐子大當日晚不食夜飯溫酒下一丸不嚼破午際取下赤小豆汁似雞肝小蝦蟆衣未再服候鮮紅即住服盧同散治男子婦人一切咳嗽喘急款冬花井泉石鵝管石鐘乳石官桂甘草白礬佛耳草各等分上為末每服一錢竹筒子吸吃日三服立效焚香透膈散治一切勞嗽壅滯胸膈痞滿雄黃佛耳草鵝管石款冬花各等分上為末每服用藥一錢安在香爐子上焚著以開口吸煙在喉中立驗罌粟神聖散治男子婦人久新日夜咳嗽不止者御米殼一兩用蜜炒烏梅肉揀人參訶子肉葶藶桑白皮各半兩上為細末每服二三錢百沸湯潑臨臥調下三黃丸新添治五勞七傷流濕潤燥消渴煩熱甚者大黃黃芩黃連各等分上為末煉蜜為丸如桐子大每服二三十丸加至五十丸生薑湯下不計時候日三服妙當歸木香湯治婦人血氣虛勞令人頭目昏眩譫語聲沉重舌根強硬言語謇澀口苦不思飲食白日間睡夜發虛汗神思恍惚夢寐狂言面色痿黃頻發喘咳遍身疼痛骨節氣走注四肢沉重背髀拘急發寒熱五心煩躁唇乾多渴胸膈不利喉咽噎塞尫羸瘦弱經曰脈大為勞宜服此藥青皮五加皮海桐皮桑白皮地骨皮丁香皮陳皮牡丹皮棕櫚皮以上諸藥全燒成灰末用十大錢稱當歸一兩木香紅芍藥各半兩上為細末每服一錢水一盞入小油二點錢一文同煎至七分溫服如婦人血藏臍下冷痛似刀攪遍身腫滿室女月經不通用斑蝥一兩大黃一兩炒銼二味為末用黃狗膽汁以溫酒調下一錢如臍下痛止心間痰未止不服二味
