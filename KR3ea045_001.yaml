body:
  text: 卷一諸證門諸證總綸黃帝曰善言天者必驗於人善言古者必合於今善言人者必厭於己如道不惑所謂明也余問夫子言而可知視而可見捫而可得今驗於發蒙解惑可得聞乎岐伯稽首對曰何道之間也天覆地載萬物番備莫貴於人人以天地之氣生四時之法成君王宰職黎庶盡欲全形貴賤雖殊寶命一矣好生惡死者是世人之常也若人有患如救水火莫待留淫日深著於骨髓所以難矣諸證標目煎厥之狀陽氣煩勞精絕闢積於夏致目盲不可視耳閉不可聽薄厥之狀陽氣大怒形氣絕而血菀於上䐜脹飧泄寒熱不散升降上下頹疝心掣寒多下墜以為諸疝心熱內掣陰陽之結四肢浮腫便血不已蠱瘈之病腎氣不足冤熱觔急白液出跳掣也膀胱不利致三焦約而遺溺腎精不足強上冥視唾之若涕惡風振寒為之勞風雖近衣絮營虛衛實名曰肉苛心移寒於肺則肺消肺移寒於腎為湧水心移熱於肺為膈消膽移熱於腦為鼻淵膀胱移熱於小腸為口糜大腸移熱於胃為食㑊熱盛則陽絡溢陽絡溢為衄衊醉以入房氣竭傷肝大脫其血月事衰少名曰血枯蘊熱怫鬱生於諸風寒濕風之三氣雜合而為諸痹宗觔弛縱發為白淫熱聚胃口而不散行故胃脘為癰面色白黑所謂疢觔口苦積熱名之膽癉腎虛內奪則為喑痱血氣竭少令人解㑊腹滿不食寒中腸泄斯病鶩溏腰股痛發胕腫不便寒生濡泄聊敘此證不能備舉煎厥證主熱出素問生氣通天論陽氣煩勞積於夏令人煎厥目盲不可以視耳閉不可以聽人參散主之治煎厥氣逆頭目昏憒聽不聞目不明七氣善怒人參遠志去心赤茯苓去皮防風去苗以上各二兩芍藥麥門冬去心陳皮去白白朮以上各一兩上為末每服三錢水一盞半煎至八分去滓溫服不計時候日再服薄厥證主肝出素問生氣通天論陽氣大怒則形氣絕而血菀於上令人薄厥於胸中赤茯苓湯主之治薄厥暴怒怒則傷肝氣逆胸中不和甚則嘔血鼽衄也赤茯苓去皮人參桔梗陳皮各一兩芍藥麥門冬去心檳榔各半兩上為末每服三錢水一盞生薑五片同煎至八分去滓溫服不計時候飧泄證主冷出素問陰陽應象論清氣在下則生飧泄清濁交錯食不化而清穀出矣白朮湯主之治飧泄風冷入中泄利不止脈虛而細日夜數行口乾腹痛不已白朮厚朴生薑制當歸去苗龍骨各一兩艾葉半兩熟炒上為末每服三錢水一盞生薑三片同煎至八分去滓空心溫服䐜脹證主心腹出素問陰陽應象論濁氣在上則生䐜脹此陰陽返則氣結不散而腹脹滿常如飽吳茱萸湯主之治䐜脹陰盛生寒腹滿䐜脹且常常如飽不欲飲食進之無味吳茱萸湯淘炒厚朴生薑制官桂去皮乾薑炮各二兩白朮陳皮去白蜀椒出子各半兩上為末每服三錢水一大盞生薑三片同煎至八分空心去滓溫服風消證主心脾出素問陰陽別論二陽之病發心脾不得隱曲女人月水病血不流脾病食不化風勝真氣消黃耆羌活湯主之治心脾受病精血虛少氣力衰乏日溢消矣黃耆一兩半去蘆頭羌活石斛防風枳殼火炒去穰人參生地黃牡蠣燒黑附子炮茯苓去皮五味子牛膝酒浸各一兩續斷半兩地骨皮三分上為末每服三錢水一大盞煎至八分去滓溫服不計時候日進三服心掣證主心出素問陰陽別論一陽發病少氣嗽泄三焦不利上咳下泄心火不寧其動若掣調中湯主之治心掣不定胸中刺氣痞壅上苦咳嗽下苦泄利白朮乾薑炮當歸人參五味子赤茯苓去皮甘草炙各一兩官桂一兩半上為末每服三錢水一盞煎至八分溫服去滓稍熱日二服臨臥風厥證主脾胃出素問陰陽別論一陽一陰發病驚駭背痛噫欠名風厥蓋胃土肝木為木剋土風勝濕不制腎水故令上逆遠志散主之治風厥多驚背痛善噫善欠意不樂身背皆痛遠志去心人參細辛去苗白茯苓去皮黃耆去蘆頭官桂各二兩半菖蒲熟乾地黃焙白朮防風各半兩上為末每服一錢至二錢溫酒調下空心食前日三服結陽證主四肢出素問陰陽別論四肢腫四肢熱盛則腫四肢者謂諸陽之本陽結者故不行於陰脈陽脈不行故留結也犀角湯主之治結陽四肢腫滿熱菀不散或毒攻注大便悶澀犀角屑玄參連翹柴胡去苗各半兩升麻木通各三錢沉香銼射干去毛甘草炙各一分芒硝麥門冬去心各一兩上為末每服三錢水一大盞同煎至八分食前去滓溫服厥疝證主腹痛出素問五臟生成論脈至大虛積氣腹中隱而難見陰沉使脾弱寒於肢膜氣厥逆也加減吳茱萸湯主之治厥疝腹中冷痛積氣上逆致陰冷於肢膜吳茱萸二兩湯洗炒川烏頭去皮炮細辛去苗各三兩良薑當歸乾薑炮官桂各一兩上為末每服二錢水一盞同煎至七分去滓溫服日進三服結陰證主便血出素問陰陽別論結陰便血一升再結二升三結三升以陰氣內結故不得通行氣血無宗滲入腸下致使漸多地榆湯主之治結陰下血不止漸漸極多腹痛不已地榆四兩甘草三兩半炙半生縮砂仁七枚每服可加為妙上為末每服五錢水三盞縮砂仁同煎至一半去滓溫服解㑊證主腎實出素問平人氣象論冬脈太過緩而澀腎實精不運解者緩㑊疑寒熱類也利腎湯主之治解㑊春脈動氣痛氣乏不欲言此為腎元有餘矣澤瀉生地黃赤茯苓去皮各一兩半檳榔麥門冬去心柴胡枳殼麩炒去穰牛膝去苗酒浸各一兩上為末每服三錢水一盞半煎至七分去滓溫服不計時候胃疸證主胃熱出素問平人氣象論食已如飢胃熱能消穀陽明脈終心火上行心憎煩身黃小便赤澀也加減茯苓湯主之治胃疸積熱食已輒飢面黃瘦胸滿脅脹小便閟赤赤茯苓陳皮去白澤瀉桑白皮銼各三兩赤芍藥白朮各四兩人參官桂各二兩石膏八兩半夏六兩湯洗生薑制焙上為末每服三錢水一盞生薑十片同煎至八分去滓溫服不計時候如病甚者加大黃朴硝各二兩蠱病證主脾風出素問玉機真藏論脾風傳腎一名疝氣小腹痛出白液名曰蠱左傳云惑以喪志名為蠱乃真精不守也大建中湯主之治蠱病小腹急痛便溺失精溲而出白液黃耆遠志去心當歸澤瀉各三兩芍藥人參龍骨甘草炙各一兩上為末每服三錢水一盞生薑五片煎至八分去滓溫服不計時候瘈病證主筋急出素問玉機真藏論蠱腹痛腎傳心觔脈相引而急精液少觔脈不榮而引急加減建中湯主之治瘈觔病相引而急及五勞七傷小便數腹痛難立人參甘草炙官桂白茯苓去皮當歸附子炮厚朴生薑制各一兩龍骨黃耆銼麥門冬白芍藥生地黃各四兩上為末每服三錢水一盞半生薑三片棗一枚餳少許煎至一盞溫服去滓勞風證主諸風出素問評熱論發在肺下病強上冥視唾涕惡風腎風入肺中振慄故俯仰成勞風芎枳丸主之治勞風強上冥視肺熱上壅唾稠喉中不利頭目昏眩川芎枳殼麩炒去穰各等分上煉蜜為丸如桐子大每服十丸溫水送下食後日三服痹氣證主陽虛陰實出素問逆調論身非衣寒中非受寒痹氣者氣血不行如從水中出不必寒傷而作也附子丸主之治痹氣中寒陽虛陰盛一身如從水中出附子炮川烏頭炮二味通銼碎炒黃色入藥官桂川椒菖蒲甘草各四兩骨碎補炒天麻白朮各二兩上為末煉蜜為丸如桐子大每服三十丸溫酒下空心食前日三服骨痹證主腎虛出素問逆調論身寒大衣不能熱腎脂枯涸不行髓少觔弱不凍慄故攣急附子湯主之治腎藏風寒濕骨痹腰脊痛不得俯仰兩腳冷受熱不遂頭昏耳聾音渾附子炮獨活防風去苗川芎丹參萆薢菖蒲天麻官桂當歸各一兩黃耆細辛去苗山茱萸白朮甘菊花牛膝酒浸甘草炙枳殼麩炒去穰各半兩上為末每服三錢水一大盞生薑五片煎至七分去滓溫服不計時候日進三服肉苛證主營虛衛實出素問逆調論人之肉苛者雖近衣絮猶尚苛也營氣虛則不仁其證𤸷重為苛也以前胡散主之治營虛衛實肌肉不仁致令𤸷重名曰肉苛虛其氣前胡去苗白芷銼細辛去苗官桂白朮川芎各三兩川椒去目閉口者生用二錢吳茱萸湯洗炒附子炮當歸去苗各二兩上銼搗以茶酒三升拌勻同窨一宿以煉成豬脂膏五斤入藥微煎候白芷黃紫色滬出滓成膏病在處摩之病以熱調此藥櫻桃大癥瘕瘡痍皆治並去諸風瘡癢疼痛傷折墜損故摩內皆可用之肺消證主心肺出素問氣厥論心移寒於肺肺消飲少溲多當補肺平心死不可治乃心肺為賊也黃耆湯主之治肺消飲少溲多補肺平心移寒在肺痿劣黃耆三兩五味子人參桑白皮銼各二兩麥門冬去心二兩枸杞子熟地黃各一兩半上為末每服五錢水二盞煎至一盞去滓溫服無時湧水證主水病出素問氣厥論肺移寒於腎名曰湧水其證如溢囊里裹漿或遍身腫滿按腹不堅疾行則濯濯有聲或咳喘不定葶藶丸主之治湧水腹滿不堅溢如囊裹漿疾行則濯濯有聲葶藶紙炒澤瀉椒目桑白皮銼杏仁去皮麩炒木豬苓去黑皮各半兩上為細末煉蜜和丸如桐子大每服二十丸蔥白湯下不計時候以利為度膈消證主肺出素問氣厥論心移熱於肺名曰膈消二者心膈有熱久則引飲為消渴耳麥門冬飲子主之治膈消胸滿煩心津液燥少短氣久為消渴麥門冬二兩去心栝蔞實知母甘草炙五味子生地黃人參葛根茯神各一兩上為末每服五錢水二盞竹葉數片同煎至一盞去滓溫服食後口糜證主口出素問氣厥論膀胱移熱於小腸膈腸不便上為口糜心肺壅熱水穀不化轉下小腸柴胡地骨皮湯主之治口糜生瘡損爛小腸有熱脹滿不便宜服之柴胡去苗地骨皮各等分上為末每服三錢水一大盞煎至八分去滓食後如有病人大段實者加大黃朴硝可瀉熱甚虙瘕證主女病出素問氣厥論小腸移熱於大腸名虙瘕津液耗散不能滑利菀結而大腸閟澀檳榔丸主之治大腸有移熱津液壅滯腹痛閟澀名曰虙瘕證檳榔大黃銼炒枳殼麩炒去穰各二兩木香桃仁去皮尖炒大麻仁另研各一兩上為末煉蜜和丸如桐子大每服十丸至十五丸溫酒下不計時候湯亦得食㑊證主胃病出素問氣厥論大腸移熱於胃善食而瘦或胃熱移於膽能食善飲火勝土也參苓丸主之治食亦胃中結熱消穀善食不生肌肉此名食㑊人參菖蒲遠志赤茯苓地骨皮牛膝酒浸各一兩上為末煉蜜為丸如桐子大每服十丸至十五丸米飲下不計時候鼻淵證主鼻出素問氣厥論膽移熱於腦則辛頞鼻淵濁涕不止如湧泉不滲而下久不已衄血為患防風湯主之治鼻淵腦熱滲下濁涕不止久而不已必成衄血之疾黃芩人參甘草炙麥門冬去心各一兩川芎一兩防風去蘆一兩半上為末每服二錢沸湯點之食後服日三服衄衊證主失血出素問氣厥論膽受胃熱循脈而上於腦陽絡溢血妄行在鼻空蔑目瞑者定命散主之治膽受熱血妄行鼻中衄衊並血汗不止硃砂水銀麝香各等分上為末每服半錢新汲水調下不計時候如用藥看老幼虛實加減鼓脹證主胃病氣逆出素問腹中論有病心腹脹滿旦食不能暮食致令胃逆不散大腸不傳逆滿雞矢醴散治鼓脹旦食不能暮食痞滿古法用此可擇焉大黃桃仁雞矢白乾者各等分上為末每服一錢水一盞生薑三片煎湯調下食後臨臥服血枯證主婦人經病出素問腹中論年少醉入房室氣竭肝傷故經衰少不來肝傷則血涸脾胃相傳大脫其血目眩心煩故月事不來也烏賊骨丸主之治血涸胸脅支滿妨飲食變則聞腥臊之氣唾血出清液前後泄血蘆茹烏賊魚骨各一兩上為末雀卵不拘數和成劑丸如小豆大每服五丸至十丸鮑魚湯下食後此日三服食壓之妙矣
