body:
  text: 卷四熱門諸病總論黃帝曰病熱當何禁之岐伯曰病熱少愈食肉則復多食則遺此其禁也因熱少愈猶未盡除不戒飲食勞動情欲擾亂奈脾胃氣虛未能消化堅食故熱復生五臟者皆熱夫熱病者傷寒之類也人之傷於寒則為病熱寒毒藏於肌膚陽氣不行散發而內為怫結故傷寒者反病為熱熱雖甚不死奈巨陽為首巨陽者諸陽之屬也諸陽為熱以氣諸陽為寒以血熱病已愈其有復作謂病已衰而熱有作所藏因其穀氣相薄兩熱相合故有所遺緣熱也雖邪氣而不盡遺熱在故當復作五臟俱熱者皆視之肝熱左頰先赤心熱顏先赤脾熱鼻先赤肺熱右頰先赤腎熱頤先赤肝熱者小便黃腹痛多臥身熱熱爭則狂驚脅滿痛手足躁而不得安臥心熱者不樂數日乃熱熱爭則心卒痛煩悶善嘔頭痛面赤無汗脾熱者頭重頰痛煩心顏青欲吐身熱熱爭則腰痛不可仰腹滿泄兩頷痛肺熱者淅然厥起毫毛惡風寒舌上黃身熱熱爭則喘咳痛走胸背不得太息頭痛不堪汗出而寒腎熱者腰痛胻酸苦渴數飲食熱熱爭則項痛而強胻寒且酸足下熱不欲言經曰汗出脈躁盛一死脈不與汗相應其病二死狂言失志者三死皆是怫熱鬱結不能解散以致危殆素問諸熱瞀瘛暴喑冒昧躁擾狂言罵詈驚駭胕腫疼酸氣逆皆手少陽相火心胞絡三焦之氣也夫腎水真陰本虛心火狂陽積熱以甚以致風熱壅滯頭面昏眩肢體麻痹皮膚瘙癢筋脈拘卷胸膈痞滿時或痛悶或鼻窒鼽衄口舌生瘡咽喉不利牙齒疳蝕或遍身生瘡癬疥或睡語咬牙驚惕虛汗或健妄心鬆煩躁多睡或大小便澀滯或煩熱腹滿或酒過積毒勞役過度中外一切勞損神氣心志不寧口苦咽乾飲食減少變生風熱諸病虛羸困倦或酒病瘦悴及老弱虛人或脾腎經虛風熱燥郁色黑齒宣身瘦焦痿或熱中煩滿飢不飲食或疸或消中善食而瘦或消渴多虛頭面腫小便數或服甘辛熱藥過度變成三消上則消渴中則消中下則消腎小便白膏也神芎丸治一切熱證常服保養除痰飲消酒食清頭目利咽膈能令遍身結滯宣通氣利而愈神強體健耐傷省病並婦人經病及産後血滯腰腳重痛小兒積熱驚風潮搐臟用丸亦日顯仁丸加黃連薄荷川芎各半兩名曰神芎丸大黃黃芩各二兩牽牛滑石各四兩上為細末滴水為丸如小豆大溫水下十丸至十五丸每服加十丸日三服冷水下亦得或煉蜜丸愈佳或久病熱鬱無問瘦悴老弱並一切證可下者始自十丸每服加十丸以利為度如常服此藥但除腸垢積滯不傷和氣推陳致新得利便快並無藥燥搔擾亦不困倦虛損頗遂病人心意或熱甚必須急下者便服四五十丸未利再服以意消息三五歲孩兒丸如麻子大凡此一法此藥至善常服二三十丸以利臟腑但有益無損或婦人血下惡物加桂枝半兩病微者常服病重者亦取利因而結滯開通惡物日下也此方除臟腑滑泄者或中寒脈遲者或婦人經病産後血下不止者及孕婦等則不宜服除此以外一切風熱雜病悶壅塞神氣不和或平人保養常服自顯其功若以效驗觀其藥味則非明本草造化之理者不可得而知其然也猶孔子贊易道明顯應化萬仁之善而不見其大道之功用故曰顯諸仁藏諸用因以云藏用丸亦其意也兼以世訛之久矣而反不喜此等妙方不肯服之每有久獲大效而誠懇求其方不得已而授之既見其方反生疑懼不復用焉亦有效而志信求其方務以廣傳救疾因而衆議百端擬疑妄生謗説致使俗醫皆畏之致道不能神但有妨病者後之君子但行其藥明顯諸人勿示其方而密藏諸用耳或以一法加黃連川芎薄荷等各半兩治一切頭目昏眩者愈佳柴胡飲子治解一切肌熱體骨蒸積熱作發寒熱往來表熱裡寒則發寒裡熱表和則發熱邪熱半在表半在裡出入進退無和即寒熱往來陰陽相勝也蓄熱寒戰表之陽和正氣與邪熱並蓄於裡脈道不行故身冷脈絶寒戰而反煩渴也及傷寒發汗不解或中外諸邪熱口乾煩渴或下後熱未愈汗後勞復或骨蒸肺痿喘嗽婦人余疾産後經病柴胡人參黃芩甘草大黃當歸芍藥各半兩上為末每服抄三錢水一盞生薑三片煎至七分溫服日三服病熱甚者加減之崔宣武柴胡飲子加半夏五味子桔梗各三錢劉庭瑞柴胡飲子與前分用不同故以録之柴胡甘草各二兩黃芩當歸芍藥大黃各一兩人參半兩半夏半兩右為大勞熱病五七錢以利為度未利更加使病不再發也木香萬安丸治一切風熱怫鬱氣血壅滯頭目昏眩鼻塞耳鳴筋脈拘卷肢體焦痿咽嗌不利胸膈痞塞腹脅痛悶腸胃燥澀淋閟不通腰腳重痛疝瘕急結痃癖堅積腸滯胃滿久不了絶走注疼痛喑俳癇病濕病腹脹水腫木香揀桂甘遂各一分牽牛二兩大戟半兩大黃紅皮檳榔各一兩皂角二兩要得肥好者洗淨水三盞煮三二沸取出槌碎揉取汁再熬成稠膏下蜜熬二沸便取出半夏蜜各一兩上膏丸小豆大每服十丸至十五丸生薑湯下小兒丸如麻子大水腫癇病諸積快利為度玉芝徐老丸治一切風壅胸脅痞悶消痰利膈美飲食調五味徐老緩慢遲老天南星乾薑各半兩黃柏一兩半牽牛四兩半夏白礬大黃各一兩蛤粉二兩上為末滴水和丸如小豆大每服十丸至二十丸溫水下食後日三服常服順氣調血令人徐老或已衰大便結者除腸垢積物可漸加至三五十丸孕婦滑泄病忌服滑泄畏牽牛大黃孕婦畏南星半夏消痞丸治積濕毒熱甚者身體面目黃心脅腹滿嘔吐不能飲食痿弱難以運動咽嗌不利肢體焦尫眩悸膈熱坐臥不寧心火有餘而妄行上為咳血衄血下為大小便血腸風痔瘻三焦壅滯閟疸熱中消渴傳化失常小兒疳積熱黃連甘葛各一兩黃芩大黃黃柏梔子薄荷藿香厚朴茴香炒各半兩木香辣桂各一分青黛一兩研牽牛二兩上為細末滴水丸如小豆大每服十丸新水下溫水亦得小兒丸如麻子大病本濕熱內甚本自利者去大黃牽牛忌發熱諸物和中丸治口燥舌乾咽嗌不利胸脅痞滿心腹痛悶小便赤澀大便結滯風氣怫鬱頭目昏眩筋脈拘急肢體疼倦一切風壅常服寬膈美食消痰止逆牽牛一兩官桂一分大黃紅皮黃芩茴香各半兩木香一分滑石二兩上為末滴水丸如小豆大每服二十九煎生薑湯下溫水亦得日三服崔宣武和中丸大黃一兩茴香炒外七味同龍腦丸治大小人一切蘊積熱毒氣不散及失喑癮疹龍腦硃砂鵬砂牛黃各等分上為末熔黃蠟為丸如米粒大每服三五丸炙甘草人參湯下不計時候大金花丸治中外諸熱寢汗咬牙睡語驚悸溺血淋閟咳衄血瘦弱頭痛併骨蒸肺痿喘嗽去大黃加梔子名曰梔子金花丸又名既濟解毒丸黃連黃柏黃芩大黃各半兩上為末滴水丸如小豆大每服三二十丸新汲水下自利去大黃加梔子小兒丸如麻子大三五丸當歸龍膽丸治腎水陰虛風熱蘊積時發驚悸筋惕搐搦神志不寧營衛壅滯頭目昏眩肌肉瞤瘛胸膈痞塞咽嗌不利腸胃燥澀小便溺閟筋脈拘奇奇猶急也重也肢體痿弱喑風癇病小兒急慢驚風常服宣通血氣調順陰陽病無再作當歸焙龍膽草大梔子黃連黃柏黃芩各一兩大黃蘆薈青黛各半兩木香一分麝香半錢另研上為末煉蜜和丸如小豆大小兒如麻子大生薑湯下每服二十丸忌發熱諸物兼服防風通聖散軟金丸治一切熱疾常服潤肌膚奈老諸熱證皆可服大黃牽牛皂角各二兩朴硝半兩上為末滴水和丸如桐子大每服三十丸白湯下自十丸用至三十丸食後妙香丸治一切久遠沉積傷寒結胸太陽厥證燥郁攻不開者皆可服此藥亦名大聖丸巴豆去皮不出油膩粉碙砂龍腦麝香中黃少許硃砂各分水銀錫結砂子各一錢上為末煉蜜和丸又一方用蠟丸如皂子大用藥時急要動一丸分作二丸扎作眼子冷水浸煎大黃湯下然後服熱茶一碗便行也局方內無碙砂加金薄妙功藏用丸新補亦名顯仁丸又名神芎丸治嘔噦不食痿弱難運血溢血泄淋閟不通或泄利三焦壅滯傳化失常並宜服之功不可述大黃黃芩黃連各半兩黑牽牛一兩滑石二分荊芥穗二兩防風一分川芎一兩木香二分官桂三分去皮上為末滴水為丸如小豆大每服二十丸三十丸生薑湯下日三服溫水亦得
