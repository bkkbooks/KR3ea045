body:
  text: 卷八水濕門水濕總論夫諸濕者濕為土氣火熱能生土濕也故夏熱則萬物濕潤秋涼則濕物燥干也濕病本不自生因於大熱怫鬱水液不能宣通即停滯而生水濕也凡病濕者多自熱生而熱氣尚多以為兼證云濕熱亦猶風熱義同雖病水寒不得宣行亦能為濕雖有此異亦以鮮矣或跗腫體寒而有水者以蓄熱入里極深本非病寒也三花神祐丸治中滿腹脹喘嗽淋閟一切水濕腫滿濕熱腸垢沉積變生疾病久病不已黃瘦困倦氣血壅滯不得宣通或風熱燥郁肢體麻痹走注疼痛風痰涎嗽頭目旋運瘧疾不已癥瘕積聚堅滿痞悶酒積食積一切痰飲嘔逆及婦人經病不快帶下淋瀝無問赤白並男子婦人傷寒濕熱腹滿實痛久新瘦弱俗不能別辨或尋常只為轉動之藥兼瀉久新腰痛並一切下痢及小兒驚疳積熱乳癖滿並宜服之甘遂大戟芫花醋拌濕炒各半兩牽牛二兩大黃一兩為細末輕粉一錢上為細末滴水為丸如小豆大初服五丸每服加五丸溫水下每日三服加至快利利後卻常服病去為度設病愈後老弱虛人常人常服保養宣通氣血消進酒食病癖悶極甚者便多服則頓攻不開轉加痛悶則初服兩丸每服加兩丸至快利為度以意消息小兒丸如麻子大隨強弱增損三四歲者三五丸依前法崔宣武神祐丸加黃柏一兩牽牛四兩大黃二兩輕粉二錢甘遂大戟芫花各一分依前法劉庭瑞神祐丸用此藥治水氣常得效賈同知稱之不已乃神仙奇絶之藥也葶藶木香散治濕熱內外甚水腫腹脹小便赤澀大便滑泄葶藶茯苓去皮豬苓去皮白朮各一分木香半錢澤瀉木通甘草各半兩辣桂一分滑石三兩上為末每服三錢白湯調下食前此藥下水濕消腫脹止泄瀉利小便若小便不得通利而反轉泄者此乃濕熱痞閟極深而攻之不開是能反為注泄此正氣已衰而多難救也慎不可攻之而無益耳白朮木香散治喘嗽腫滿欲變成水病者不能臥不敢食小便閟者白朮木豬苓去皮甘草赤茯苓澤瀉各半兩木香檳榔各三錢陳皮二兩去白官桂二錢滑石三兩上為末每服五錢水一盞生薑三片同煎至六分食後去滓溫服大橘皮湯治濕熱內甚心腹脹滿水腫小便不利大便滑泄橘皮一兩去白木香一分滑石六兩檳榔三錢茯苓一兩去皮木豬苓去皮澤瀉白朮官桂各半兩甘草二錢上為末每服五錢水一盞生薑五片煎至六分去滓溫服大小便祕先服十棗湯二三日後再服此藥葶藶膏治水腫腹脹牛黃麝香龍腦各一分昆布海藻上同二十分洗牽牛桂心各八分椒目三分葶藶六分炒上為末別搗葶藶熬成膏丸如桐子大每服十丸日再服稍利小便為度詳虛實加減茯苓散治諸般氣腫等疾芫花醋拌炒澤瀉郁李仁甜葶藶漢防己各錢半陳皮去白白檳榔瞿麥各半兩藁本二錢半滑石三分大戟炒三分上為細末每服一錢取桑白皮濃煎湯空心調下取下碧緑水如爛羊脂即瘥如未盡膈日又服腫消如故不用服忌鹽百日調胃散治胸膈痞悶不思飲食脅肋硬痛消腹脹半夏制甘草炙厚朴去皮陳皮去白藿香各等分上為末每服一錢生薑三片棗二枚水一盞同煎溫服食前二氣散治水氣蠱脹滿白牽牛黑牽牛各二錢上為末用大麥面四兩同一處為燒餅臨臥用茶湯一盞下降氣為驗雄黃神金散治十種水氣雄黃葶藶用糯米和炒半熟米不用各一兩澤瀉一兩椒目半兩大戟巴戟去心茯苓去黑皮芫花醋五升浸一日炒甘遂桑白皮以上各一兩上為末空心用井花水調下每服一錢加至五錢以利為度忌鹽醋生冷毒物油膩血物從發處加藥一分從腳腫根在心加葶藶從肚腫根在腹加椒目從陰腫根在胸加澤瀉從膝腫根在肝加芫花從面腫根在肺加桑白從心腫根在肋加雄黃從肢腫根在脾加甘遂從口腫根在小腸加巴戟從腰腫根在腎加大戟從四肢腫根在胃加茯苓萬勝散治十種水氣不可愈者海帶海藻海蛤芫花醋浸炒甘遂大戟甜葶藶樟柳根續隨子巴戟去心各等分上為末每服三錢至五錢溫酒調下臨臥間日再服牽牛丸治一切濕熱腫滿等疾黑牽牛黃芩大黃大椒滑石各等分上為細末酒煮麵糊和丸如桐子大每服五丸至七丸生薑湯下食後虛實加減梔子柏皮湯治頭微汗小便利而微發黃者濕熱相摶微者宜服大梔子十五個黃柏半兩甘草一分上銼如麻豆大水三盞煮至一盞絞汁分三次作一日服溫吃不計時候大戟丸治十種水氣腫脹喘滿熱寒咳嗽心胸痞悶背項拘急膀胱緊腫於小腹小便不通反轉大便溏泄不能坐臥大戟芫花醋炒甘遂海帶海藻郁李仁續隨子各半兩樟柳根一兩以上八味為末每料抄藥末十五錢七分便入後藥硇砂輕粉各一錢粉霜一錢水銀砂子一皂子大龍腦半錢巴豆二十一個生用去皮上八味已下同研勻用棗肉為丸如緑豆大每服五丸至七丸龍腦臘茶送下食後臨臥虛實加減粉霜丸治病水鼓滿不食四肢浮腫大小便閟不進飲食粉霜硇砂海蛤玄精石寒水石燒粉白丁香頭白麵各一錢輕粉三錢海金砂一錢上研勻著紙裹數重上使麵裹又紙裹冷酒蘸了桑柴火燒面熟為度宿𩚫餅和丸如桐子大每服三丸生薑湯下一日三服一日加一丸至六日不加即止以補之妙苦葶藶丸治一切水濕氣通身腫滿不可當者人參一兩苦葶藶四兩於鍋內紙上炒黃色為度上二味同為細末用棗肉和丸如桐子大每服十五丸煎桑白皮湯下日進三服空心食前此藥恐君子不信試驗之肉豆蔻丸治水濕腹脹如鼓不食者病可下肉豆蔻檳榔輕粉各一分黑牽牛一兩半取頭末上為末麵糊為丸如緑豆大每服十丸至二十丸煎連翹湯下食後日三服
