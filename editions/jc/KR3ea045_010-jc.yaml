body:
  text: 卷十燥門諸燥總論燥乾者今肺之本燥金受熱化以成燥澀也兼火熱致金衰耗液而損血鬱而成燥者由風能勝濕熱能耗液故經云風熱火同陽也寒濕燥同陰也又燥濕小異也金燥雖屬秋陰而其性異於寒濕而反同於風熱火也又加大便乾澀乃大腸受熱化成燥澀經云諸澀枯涸又如癱瘓中風皆因火熱耗損血液玄府閉塞不能浸潤金受火鬱不能發聲經云肺主聲肢痛軟戾者風熱濕相致而遂以遍枯語音澀手足不遂也然中寒吐瀉亡液而成燥亦以鮮矣亦有寒濕相郁營衛不能開發貫注多成偏枯經曰諸澀枯涸幹勁皴揭皆屬於燥也又如胃膈癉熱煩滿飢不欲食或癉成消中善食而瘦或燥熱鬱甚而成消渴多飲而數小便或因熱病或恣酒欲誤服熱藥以致脾胃真陰陽損虛肝心衰弱也狂陽心火燥其三焦腸胃燥澀怫鬱而水液不能宣行也則周身不得潤澤故瘦悴黃黑也而燥熱消渴然雖多飲亦其水液不能浸潤於腸胃之外渴不能止而便注為小便多出俗未明妄為下焦虛冷誤人多矣又如周身熱燥怫鬱故變為雀目或內障癰疽瘡瘍上為咳嗽喘下為痔利或停積而濕熱內甚不能傳化者變為水腫濕脹也世傳消渴病及消瘦弱或小便有脂液者為腎消也此為三消病也消渴消中消腎經意但皆熱之所致也人參白朮湯治胃膈癉熱煩滿飢不欲食癉成為消中善食而瘦燥熱鬱甚而成消渴多飲而數小便兼療一切陽實陰虛風熱燥郁頭目昏眩中風偏枯酒瘑積毒一切腸胃燥澀倦悶壅塞瘡疥痿痹並傷寒雜病產後煩渴氣液不得宣通人參白朮當歸芍藥大黃山梔子荊芥穗薄荷桔梗知母澤瀉各半兩茯苓去皮連翹栝蔞根乾葛各一兩甘草三兩藿香葉青木香官桂各一兩石膏四兩寒水石二兩滑石半斤上為細末每服抄五錢水一茶盞入盆硝半兩生薑三片煎至半盞絞汁入蜜少許溫服漸加至十餘錢得臟腑流利取效如常服以意加減兼服消痞丸散以散腸胃結滯濕熱內甚自利者去了大黃芒硝絳雪散治消渴飲水無度小便數者大有神效黃芩黃丹漢防己栝蔞實各等分上為細末每服二錢湯漿水調下臨臥時並進三二服即止人參散治腎消善飲而食後數小便溺者人參三錢白朮澤瀉栝蔞桔梗梔子連翹各半兩葛根黃芩大黃薄荷白茯苓各一兩甘草一兩半石膏二兩滑石寒水石各三兩上為末入縮砂仁三錢每服五錢水一盞煎至七分入蜜少許再煎三二沸去滓食前食後服消痞丸大黃甘草飲子治男子婦人一切消渴不能止者大豆五升先煮三沸出淘苦水再煮大黃一兩半甘草大粗者四兩長四指打碎上三味用井水一桶將前藥同煮三五時如稠強水少更添豆軟盛於盆中故冷令病人食豆渴食湯汁無時候食盡如止渴燥罷不止再煮前藥不三次病悉愈痢門泄痢總論夫痢者五臟之積濁而不散或厭冷物或冒寒暑失飢不能宣發或傷冷飽食或服暖藥過多鬱而成痢其病二三日則利為寒青痢為熱誤也今人瘡癤初發刺開乃血多日成膿何為先熱而後寒也叔和云濕多成五泄腸走若雷奔愚醫不悟三日黃者乃熱青利是寒太素曰五泄有溏泄鶩泄飧泄濡泄滑泄也此乃五泄五泄者青是感肝木之象其色青赤者受心火之氣其色赤白者得西方金肺之氣其色白黃者脾土之色蒼者土氣之下腎水隨之其色蒼也三日蒼曰寒黃赤熱其三日非也若下利熱極頻並窘痛或久不愈諸藥不能止者須下之以開除濕熱痞閉積滯而使氣液宣行者宜以逐之兼宣利積熱也益元散治身熱吐痢泄瀉腸癖下痢赤白癃閉淋痛利小便偏主石淋乃服金石熱藥多待為砂石從小便淋出者也蕩胃中積聚寒熱宣積氣通九竅六腑生津液去留結消蓄水止渴寬中除煩熱心躁腹脹痛悶補益五臟大養脾腎之氣此腎水之藏非為主之府也理內傷陰痿安魂定魄補五勞七傷一切虛損主癇痓驚悸其季切心動貌健忘止煩滿短氣藏傷咳嗽飲食不下肌肉疼痛並口瘡牙齒疳蝕明耳目壯筋骨通經脈和血氣消水穀保元真解百藥酒食邪毒耐勞役飢渴宣熱僻中外諸邪所傷久服強志輕身注顏延壽及解中暑傷寒疫癘飢飽勞損憂愁思慮恚怒瘟疫傳染並汗後遺熱勞復諸疾並解兩感傷寒能令遍身結滯宣通氣和而愈及婦人下乳催生產後損氣血衰陰虛熱甚一切熱證兼吹奶乳癰此神驗之仙藥也唯孕婦不宜服滑胎也砂仁滑石各二兩甘草炙四錢上為末每服二錢蜜少許溫水調下無蜜亦得日三服欲冷飲者新汲水調下解利傷寒發熱蔥白豆豉湯調下四錢每服水二盞蔥白五寸豆豉五十粒煮取汁一盞調下並三服效為度此藥是寒涼解散鬱熱若病甚不解多服此藥無害但有益而無損俗惡性寒兼易得之賤物而不明素問造化之理故不取本草神驗之言而多不用焉若以隨證驗之乃凡人之仙藥也不可闕之傷寒當汗而不可下當下而不可汗者且如誤服此藥則汗出自愈裡熱便得宣通而愈或半在裡半在表可和解而不可發汗吐下者若服上藥多愈亦獲小效是解散怫鬱邪熱甚者小加減涼膈散和解為佳或人不當汗者加蒼朮末二分同蔥白豉同煎湯調服甚良或孕婦不宜服以滑石麻黃桂枝要發汗當即用甘草一兩蒼朮二兩同為末每服四錢水一盞半更加入蔥白五寸豆豉五十枚同煎至六分去滓溫服並三服取微汗為度逼毒散非孕婦可服太白散加入麻黃二兩去節如法煎服世云神白散或逼毒散與加麻黃去節蒼朮各等分稱濟眾云青龍散或青龍散欲更加入滑石與蒼朮二倍最為發汗之妙藥也惟正可汗者即用此服之則轉加熱也名為大逼毒散此解利兩感同更兼煎涼膈散調下益元散四錢或下乳用豬肉面羹或酒之類調下四錢不計時候日三服宜食肉面羹粥催產用溫油漿調下三錢並二三服以產為度或死胎不下者煎三一承氣湯一服調下五錢須臾更頻用溫油漿調服前後俱下胎可活產母也兒難產或死胎不下者皆由風熱燥澀堅斂結滯不能舒緩是故產戶不得自然開也其藥力至則熱結頓開而產矣慎不可溫補而反生燥熱也俗未知產後損血日夜疼痛怖懼以致神狂氣亂則陰氣損虛邪熱太甚而為諸證由不明素問造化故不識證候陰陽反以妄謂產後諸虛百損便為虛冷而無熱也誤以熱藥溫補或見渴甚者不令飲水本為善心為害多矣豈知治病之道俱以臨時審其臟腑六氣虛實明其標本如法治之而已矣此藥之常多用雖為效至大俗以病異藥同將為妄行反招侮慢今以若加黃丹令桃仁色是以名之紅玉散若加青黛令輕粉碧色名碧玉散若加薄荷葉末一分同研名雞蘇散主療並同但以迴避愚俗之妄侮慢耳玄青丸治下痢勢惡頻並窘痛或久不愈諸藥不能止須可下之以開除濕熱痞悶積滯而使氣液宣行者宜以逐之兼宣利積熱酒食積黃瘦中滿水腫腹脹兼療小兒驚疳積熱乳癖諸證唯泄瀉者勿服黃連黃柏大黃甘遂芫花醋拌炒大戟各半兩牽牛四兩草末一兩以上同為末輕粉二錢青黛二兩上為末灑水為丸小豆大初服十丸每服加十丸空腹清晨用酒送下以快利為度後常服十五二十丸數日後得食久病未徑除者再加取利利後卻常服隨意消息病去為度後隨證止之小兒丸如黍米或麻子大退驚疳熱積不下者須常服十丸阿膠梅連丸治下痢無問久新赤白青黑疼痛諸證金井阿膠淨草灰炒透明臼別研不細者再炒研細烏梅肉去核炒黃柏銼炒黃連當歸焙赤芍藥乾薑炮赤茯苓去皮各等分上為末入阿膠研勻水丸桐子大溫米飲下十丸食前兼夜五六服小兒丸如綠豆大忌油膩脂肥諸物也牛黃神金丸治大人小兒嘔吐瀉痢無問新久赤白諸色或渴或不渴小便澀或不澀並小兒驚疳積熱痃癖堅積腹滿硬痛作發往來亦能寬膈消食輕粉粉霜硇砂以上別研雄黃研硃砂信砒巴豆去皮各一錢黃丹蠟各三錢上先研粉霜次旋入硇砂研細下雄黃硃砂信砒再研下丹粉研勻別研巴豆爛為油與前藥研勻近火上炙控熱別研蠟軟入藥勻搓成劑旋丸小豆大新汲水下一丸小兒黍米麻子大或止吐瀉痢疾調甘露散即桂苓甘露飲或益元散亦得芍藥柏皮丸治一切濕熱惡痢氣升窘痛無問膿血並宜服之芍藥柏皮各三兩當歸黃連各半兩上為末水丸如小豆大溫水下三四十丸無時兼夜五六服忌油膩脂肥發熱等物二勝丸治泄痢虛損不問新久者鹽豉紫蒜去皮各等分上同杵為膏丸如桐子大每服三丸至九丸米飲湯下如未愈及赤白痢腹滿脅痛更與杏仁丸杏仁丸治一切赤白瀉痢腹痛裡急後重者杏仁四十九個巴豆四十九個去皮上二藥同燒存性研細如泥用蠟熔和旋丸如桐子大每服一二丸煎大黃湯下間日一服白朮聖散子治一切瀉痢久不瘥並婦人產後利亦治御米殼二兩蜜炒當歸肉豆蔻縮砂仁石榴皮訶子乾薑炮陳皮去白白朮甘草芍藥各一兩上為細末每服二錢水一大盞入乳香同煎和滓服勝金膏治一切瀉痢不已胃脈浮洪者反多日不已者瀉小者立止巴豆皮楮實同燒存性上為末熔蠟丸如綠豆大每服五丸煎甘草湯下大聖真金散治一切寒熱溏瀉赤白等痢疾御米殼半斤炒甘草一兩炙乾薑半兩炮當歸一兩酸石榴皮一兩炒陳皮去白白茯苓去皮各一兩上為末每服二錢水一盞小兒半盞乳香同煎至七分食前忌油膩生冷毒物等車前子散一名斷痢散治一切痢不止車前子不以多少炒香上為末每服二錢米飲調下食前空心象骨散治脾胃虛弱心腹脹滿水穀不消噫氣吞酸食輒嘔吐霍亂泄瀉膿血四肢沉重臍腹疼痛裡急夜起頻並不思飲食皆可治之象骨四兩炒訶子取肉二兩肉豆蔻一兩甘草二兩乾薑半兩上為末每服三錢水一盞半煎至八分和滓熱服食前日三服海蛤玉粉散治血痢解臟中積熱毒海蛤不以多少上為末每服二錢入蜜少許冷水調下不計時候
