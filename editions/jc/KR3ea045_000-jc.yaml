front:
  text: 重刻劉守真先生宣明論方序按本傳劉完素字守真河間人嘗遇異人陳先生以酒飲守真大醉及寤洞達醫術若有授之者乃撰運氣要旨論精要宣明論慮庸醫或出妄說又著素問玄機原病式特舉二百八十八字注二萬餘言然好用涼劑以降心火益腎水為主自號通玄處士金承安間章宗徵之不就賜號高尚先生本郡志稱所論著皆發前古所未發與潔古齊名世號劉張法蓋古君子而托醫以避亂世者又按列傳張元素字潔古易州人夜夢有人用大斧長鑿鑿開心竅納書於中自是洞徹醫術完素病傷寒八日不食不知所為元素往候完素面壁不顧元素曰何見待之卑如此哉既為診視謂之曰服某藥乎曰然元素曰子誤矣某味性寒下降走太陰陽亡汗不能出今脈如此當服某藥奏效矣完素大服如其言遂愈元素自此顯名余因是知醫術之不可與尋常人語也嘗疑司馬遷氏稱扁鵲遇長桑君之事頗涉謬悠乃即近史飲酒鑿心之說證之豈盡無徵不信者哉殆以醫道通玄非神機不得其秘而世之習旁門執方書守意見以戕伐生靈者由其無所從悟也守真本內經著要旨宣明二論總十七萬余言又述習醫要用直格晚年著保命集三卷自謂軒岐微妙之旨得之心髓不敢輕以示人蓋自秦越人張仲景之後千有餘年而先生出上以承正派之學下以啟丹溪之傳通於南北以永仁術不其偉與說者曰不由𤸔子不知異端之害深不由守真不知偏門之罪大甚哉邪之亂正也先生之術既行世醫竊試其法得效者多猶紿其名恥言涼藥謂去熱藥為非今觀劉張二傳好用涼藥性寒下降之言則史氏猶為不祛世俗之見其稱元素之言曰運氣不濟古今異軌古方新病不相能也又似以陰詆五運六氣之辯者余嘗論之內經運氣之旨千載不毀之道至守真而大闡之極深研幾之學也何可議也其救偏補弊之功發明治溫暑之法而力闢辛熱香燥之毒所以補前賢之未備而救末流之為害也然實則無所不該無所不治而近世傍求醫論以謂熱病用河間其亦就所重立言邪可謂獨識其全矣泛觀河間諸書烏附等藥亦多用之是又何邪噫後之庸工以寒涼之劑誤人而莫之知悟者又河間之罪人亦是恃賈大夫以民部來守郡期歲中出俸金開局施藥活人不可勝計偶得此書於正科馬志坤氏因命校讎再三又捐俸而刻之且欲購全集而匯焉與東垣十書並傳也大夫為政一以治人為本刻斯集也亦以寓仁惠之心而濟之也間嘗迎養二親於郡即適太夫人有恙志坤一藥而愈因奇其功而褒美之叩其術則能留心於劉張法者故有是刻是大夫之孝由此達之人人也先正有言事親者不可不知醫信然哉隆慶三年黃鐘月既望保定府通判北海馮惟敏序
