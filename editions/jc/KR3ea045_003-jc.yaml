body:
  text: 卷三風門諸風總論素問云諸風掉眩強直肢痛軟戾裡急筋縮皆足厥陰風木之位肝膽之氣也風者動也動者搖也所謂風氣甚而主目眩運由風木王則是金衰不能制木而木能生火故風火多為熱化皆為陽熱多也風為病者或為寒熱或為熱中或為寒中或為癘風或為偏枯或為腰脊強痛或為耳鳴鼻塞諸證皆不仁其病各異其名不同經云風者善行而數變腠理開則灑然寒閉則熱而悶風氣俱入行於諸脈分肉之間與衛氣相干其道不利致使肌肉膹䐜而有瘍也衛氣所凝而不行故其肉有不仁也分肉之間衛氣行處風與衛氣相摶俱行肉分故氣道澀而不利氣道不利風熱內郁衛氣相摶肉膹䐜而瘡出衛氣被風鬱不得傳遍升凝而不行則肉不仁也謂皮肉𤸷而不知寒熱痛癢如木石也經曰風者百病之首也其變化乃為他病無常皆風氣所發也以四時五運六氣千變萬化沖蕩推擊無窮安得失時而絕也故春甲乙傷於風者為肝風夏丙丁傷於風者為心風季夏戊己傷於風者為脾風秋庚辛傷於風者為肺風冬壬癸傷於風者為腎風風中五臟六腑自俞而入為臟腑之風肺風之狀多汗惡風色白時嗽短氣晝則微暮則甚心風之狀上同善怒色赤病甚則言不可快肝風之狀善悲色微蒼嗌乾善怒時憎女子脾風之狀身體怠墮四肢不收色薄微黃不嗜飲食腎風之狀面痝然浮腫脊痛不能正立其色炲隱曲不利又曰風寒熱諸疾之始生也人之腑腑皆風之起謂火熱陽之本也謂曲直動搖風之用也眩運嘔吐謂風熱之甚也夫風熱怫鬱風大生於熱以熱為本而風為標言風者即風熱病也風氣壅滯筋脈拘卷肢體焦痿頭目昏眩腰脊強痛耳鳴鼻塞口苦舌乾咽嗌不利胸膈痞悶咳嘔喘滿涕唾稠黏腸胃燥熱結便溺淋閉或夜臥寢汗咬牙睡語筋惕驚悸或腸胃怫鬱結水液不能浸潤於周身而但為小便多出者或濕熱內郁而時有汗泄者或因亡津液而成燥淋閉者或因腸胃燥郁水液不能宣行於外反以停濕而泄或燥濕往來而時結時泄者或表之陽和正氣衛氣是也與邪熱相合併入於裡陽極似陰而戰煩渴者表氣寒故戰裡熱甚則渴或虛氣久不已者經言邪熱與衛氣併入於裡則寒戰也並出之於表則發熱合則病作離則病已或風熱走注疼痛麻痹者或腎水真陰衰虛心火邪熱暴甚而僵仆或卒中久不語或一切暴喑而不語語不出聲或暗風癇者或洗頭風或破傷或中風諸潮搐並小兒諸疳積熱或驚風積熱傷寒疫癘而能辨者或熱甚怫結而反出不快者或痘黑陷將死或大人小兒風熱瘡疥及久不愈者或頭生屑遍身黑黧紫白斑駮或面鼻生紫赤風刺癮疹俗呼為肺風者或成癘風世傳為大風疾者或腸風痔漏並解酒過熱毒兼解利諸邪所傷及調理傷寒未發汗頭項身體疼痛者並兩感諸證兼治產後血液損虛以致陰氣衰殘陽氣鬱甚為諸熱證腹滿澀痛煩渴喘悶譫妄驚狂或熱極生風而熱燥郁舌強口禁筋惕肉瞤一切風熱燥證鬱而惡物不下腹滿撮痛而昏者惡物過多而不吐者不宜服之兼消除大小瘡及惡毒兼治墮馬打撲傷損疼痛或因而熱結大小便澀滯不通或腰腹急痛腹滿喘悶者防風通聖散防風川芎當歸芍藥大黃薄荷葉麻黃連翹芒硝朴硝是者以上各半兩石膏黃芩桔梗各一兩滑石三兩甘草二兩荊芥白朮梔子各一分上為末每服二錢水一大盞生薑三片煎至六分溫服涎嗽加半夏半兩薑製曹同知通聖散防風芍藥各二錢半甘草三兩荊芥三錢半薄荷一兩白朮一分石膏一兩川芎半兩滑石三兩當歸半兩大黃半兩麻黃半兩山梔子一分連翹半兩桔梗一兩無芒硝無縮砂崔宣武通聖散防風芍藥荊芥當歸白朮山梔子各一分川芎大黃薄荷連翹黃芩桔梗縮砂各半兩甘草石膏各一兩滑石三兩劉庭瑞通聖散此方有縮砂無芒硝其餘皆同緣庭瑞於河間守真先生禮師傳之隨從二年始受於方斯且取為瑞而可准憑以用之兼庭瑞以用治病百發百中何以疑之因錄耳但庭瑞臨時以意加減一依前法嗽加半夏半兩生薑制防風天麻散治風麻痹走注肢節疼痛中風偏枯強暴音不語內外風熱壅滯解昏眩防風天麻川芎羌活香白芷草烏頭白附子荊芥穗當歸焙甘草各半兩滑石二兩上為末熱酒化蜜少許調半錢加至一錢覺藥力運行微麻為度或煉蜜為丸如彈子大熱酒化下一丸或半丸細嚼白湯化下亦得散鬱結宣通氣如甚者更服防風通聖散犀角丸治風癇日發作有時揚手擲足口吐痰涎不省人事暗倒屈伸犀角末半兩赤石脂三兩朴硝二兩白殭蠶一兩薄荷葉一兩上為末麵糊為丸如桐子大每服二十丸至三十丸溫水下日三服不計時候如覺痰多即減丸數忌油膩物風痓病目直卒中口噤背強如弓臥動搖手足抽搦無汗名剛為陽痓有汗名柔為陰痓通三一承氣下妙搜風丸治邪氣上逆以致上實下虛風熱上攻眼目昏耳鳴鼻塞頭痛眩運燥熱上壅痰逆涎嗽心腹痞痛大小便結滯清利頭目鼻聰耳鳴宣通血氣人參茯苓天南星各半兩藿香葉一分乾生薑白礬生各一兩蛤粉二兩寒水石一兩大黃黃芩各一兩牽牛四兩薄荷葉半兩滑石四兩半夏四兩上為末滴水為丸如小豆大每服十丸生薑湯下加至二十丸日三服川芎石膏湯治風熱上攻頭面目昏眩痛悶風痰喘嗽鼻塞口瘡煩渴淋閟眼生翳膜清神利頭宣通氣血中風偏枯解中外諸邪調理諸病勞復傳染川芎芍藥當歸山梔子黃芩大黃菊花荊芥穗人參白朮各半兩滑石四兩寒水石二兩甘草三兩桔梗二兩縮砂仁一分石膏防風連翹薄荷葉各一兩上為末每服二錢水一盞煎至六分去滓食後水調亦得忌薑醋發熱物川芎神功散治風熱上攻偏正頭痛無問微甚久新頭面昏眩清神川芎四錢甘草一分川烏頭吳白芷天南星麻黃各半兩上為末每服二錢水一盞生薑三片煎至半盞投清酒半盞避風換骨丹治癱瘓中風口眼喎斜半身不遂並一切風癇暗風並宜服之頌曰我有換骨丹傳之極幽秘疏開病者心扶起衰翁臂氣壯即延年神清自不睡南山張仙翁三百八十歲槐皮芎術芷仙人防首蔓十件可停勻苦味香減半龍麝即少許硃砂作衣纏麻黃煎膏丸大小如指彈修合在深房勿令陰人見夜臥服一粒遍身汗津滿萬病自消除神仙為侶伴麻黃煎膏仙術香白芷槐角子取子川芎人參防風桑白皮苦參威靈仙何首烏蔓荊子木香龍腦研硃砂研麝香研五味子上為末桑白單搗細稱以麻黃膏和就杵一萬五十下每兩分作十丸每服一丸以硬物擊碎溫酒半盞浸以物蓋不可透氣食後臨臥一呷咽之衣蓋覆當自出汗即瘥以和胃湯調補及避風寒茶下半鉛紅散治風熱上攻陽明經絡面鼻紫赤癮疹俗呼為肺風者以肺主鼻而又淺在皮膚之內皮膚屬於肺舶上硫黃白礬灰各半兩上為末少許入黃丹染與病人面色同每上半錢津液塗之洗漱罷臨臥再服防風通聖散效速神芎散治風熱上攻頭目眩痛上壅鼻並牙齒悶痛川芎鬱金各二錢荊芥穗薄荷葉紅豆各一分右為末入盆硝二錢研勻鼻內㗜三二剜耳許力慢加藥病甚兼夜㗜萬靈丸治腎臟一切耳鳴腰疼筋骨痛赤芍藥五靈脂防風草烏頭炮各二兩黃耆細辛海桐皮山茵陳骨碎補地龍各八錢黑狗脊二兩牛膝何首烏蔓京子白附子川烏頭巨勝子各八錢白朮一兩芫花三錢炒黑牽牛半兩青皮二錢御米子二錢炒上為末酒麵糊為丸如桐子大每服十丸至二十丸溫酒下空心食前服伊祁丸治腰腳拳攣鶴膝風筋縮伊祁頭尾全者桃仁生白附子阿魏桂心白芷當歸北漏蘆安息香用胡桃穰研芍藥牛膝地骨皮威靈仙羌活各等分上為末麵糊為丸如彈子大每服一丸空心溫酒化下祛風丸治中風偏枯手足戰掉語言謇澀筋骨痛綠豆粉川烏頭炮草烏頭炮天南星半夏各一兩甘草川芎藿香葉苓苓香地龍蠍梢各三錢白殭蠶淘米泔浸去絲川薑半兩炮上為末一兩用綠豆粉一兩又一法用藥一兩以白麵二兩滴水為丸如桐子大量人虛實加減細嚼茶酒下五丸至七丸食後初服三丸漸加舒筋散治婦人血氣併產後風熱搐搦俗謂雞爪風舒筋人參川芎官桂丁香各半兩木香天麻酒浸焙各一兩井泉石四兩別為末上為末每服三錢井泉石末三錢大豆半升淨淘好酒一大升煮豆軟去豆用豆汁酒調下後以酒送下蓋覆汗出為效勝金丸治風熱驚駭不時旋運潮搐口吐痰沫忽然倒地不省人事名曰癇病白殭蠶細辛天南星皂角炙黃川烏頭生烏蛇真者好酒浸去骨白礬枯桔梗威靈仙何首烏草烏頭各一兩荊芥穗川芎各二兩上為末酒麵糊為丸如桐子大每服十丸食後溫酒下比金散治傷寒冒風頭目痛四肢拘卷鼻塞麻黃白芷細辛荊芥穗菊花防風石膏何首烏川芎薄荷乾蠍草烏頭各等分上為末每服一錢水一盞煎溫服酒茶亦得神白丹治傷寒積熱及風生驚搐或如狂病諸藥不效此方不可盡述鉛白霜一分輕粉半兩粉霜一兩用白麵六錢和作餅子炙熟同研上為末滴水為丸如桐子大每服十丸至十五丸米飲下量虛實加減桃仁丸治一切風毒遍身疼痛四肢拘急草烏頭生用五靈脂各三兩桃仁取霜一兩上為末酒煮麵糊丸如桐子大以青黛為衣嚼胡桃仁以溫酒下五丸食後加減瓜蒂神妙散治頭目昏眩偏正頭痛等焰硝雄黃川芎薄荷葉道人頭藜蘆各一分天竺黃一錢半如無以鬱金代之上為末研細含水鼻中㗜一字神驗清風散治頭目昏眩咽膈不利痰涎壅塞石碌一錢硃砂牙硝雄黃各三字龍腦一字瓜蒂二錢滑石赤小豆各半錢皂角一字去皮炙黃取末上為極細末每服半錢新汲水調下如口噤不省人事滴水鼻中或欠者可治為驗靈砂丹治破傷風一切諸風等威靈仙黑牽牛何首烏蒼朮各半兩香附子六兩川烏頭去皮硃砂沒藥乳香各三錢陳皂角四錢炙黃去皮上為末把皂角打破用酒二升半春夏三日秋冬七日取汁打麵糊為丸如桐子大每服五丸如破傷風煎鰾酒下如牙疼赤眼捶碎研三五丸鼻㗜之川芎天麻散治頭頂痛頭面腫拘急風傷營衛發燥熱川芎細辛苦參地骨皮菖蒲何首烏蔓荊子薄荷葉杜蒺藜牛蒡子荊芥穗虼蚾草威靈仙防風天麻各一兩甘草二兩炙上為末每服二三錢研蜜水調下茶水任不計時薄荷白檀湯新增治風壅頭目眩鼻塞煩悶精神不爽消風化痰清頭目白檀一兩荊芥穗二兩薄荷葉四兩栝蔞根二兩甘草四兩炙白芷二兩鹽四兩縮砂仁半兩上為末每服一錢百沸湯點食後臨臥稍熱溫服菊葉湯新增治一切風頭目昏眩嘔吐面目浮腫者菊花去梗羌活獨活旋覆花牛蒡子甘草各等分上為末每服二錢水一盞半生薑三片同煎至七分去滓溫服食後
