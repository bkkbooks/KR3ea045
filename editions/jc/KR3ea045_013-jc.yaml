body:
  text: 卷十三諸痛門諸痛總論夫痛者經脈流行不止環周不休寒氣入經而稽遲血泣凝而不行客於脈外血少客於脈中氣不通故卒然而痛其痛或卒然而止或痛甚而不休或痛甚不可按或按之而痛止或按之而無益或痛喘動應手或心與背相引而痛或脅肋相引而痛或腹痛引陰股或痛宿昔而成積或卒然而痛死不知人而少間復生或痛而閉不通者諸痛各不同形經曰寒氣客於脈外則脈寒脈寒則蜷縮蜷縮則脈絀音督急脈絀急則外引小絡衛氣不得流通故卒然而痛得熱則痛止寒氣客於經脈之中與炅氣相薄則脈滿滿則血氣亂故痛而不可按寒氣客於腸胃之間膜原之下血不得散小絡急引故痛按之血氣散痛乃止也脅肋痛者寒氣客於厥陰之脈也背與心相引痛者寒氣客於背俞之脈注於心相引痛寒氣客於陰股血泣在小腹相引痛卒然痛死者寒氣客於五臟厥逆上壅陰氣竭陽氣未入故卒然痛死氣復反則生矣視其五色黃赤為熱白青則為寒青黑為痛經曰感虛則陷下其留於肋骨之間寒多則筋攣骨痛熱則筋弛肉消但痛癢瘡瘍癰痛腫而聚者皆屬心火熱也不可一例傷寒凡治痛者先察本次明經絡皮部虛實用藥無誤矣辰砂一粒丹治一切厥心痛小腸膀胱痛不可止者附子一兩炮鬱金橘紅等附子停用上為末醋麵糊為丸如酸棗大以硃砂為衣每服一丸男子酒下婦人醋湯下服罷又服散子神聖代針散治一切心痛不可忍者心驚欲死者小腸氣搐得如角弓膀胱腫硬一切氣刺虛痛並婦人血癖血迷血暈血刺血衝心胎衣不下難產但一切痛疾服之大有神效只是要詳疾證用藥乳香沒藥當歸香白芷川芎各半兩元青一兩去翅足上為細末更研每服一字病甚者半錢先點好茶一盞次摻藥末在茶上不得吹攪立地細細急呷之茴香丸治男子婦人臍腹疼痛刺胸膈不止者茴香炒良薑官桂各半兩蒼朮一兩米泔浸上為末酒煮麵糊和丸如桐子大每服十丸生薑湯下趁痛丸治一切走注疼痛婦人經脈住滯水腫腹脹甘遂大戟芫花黃牽牛各等分上為末以蕎麵同末和作餅子扦切為棋子煮熟服之得利為度每服一錢加減相虛實六合散治一切燥結汗後餘熱宣轉不通亦名金鑰匙散並治小腸氣結心腹滿胸中結痞走疰疼痛大黃一兩紙裹煨白牽牛半兩生黑牽牛微炒甘遂各半兩檳榔三錢生輕粉一錢上為細末每服一錢蜜水調下服量虛實加減定痛丸治打撲損傷筋骨疼痛等乳香一分川椒當歸沒藥赤芍藥川芎自然銅蒴藋根以上各半兩上為末熔蠟為丸如彈子大細嚼酒下一丸骨碎者先用竹夾夾定三五日依舊小可與服如打撲骨損者先整骨定用竹夾夾定然後先用好酒下麻黃三錢然後服藥香殼散治小腸氣臍腹攪痛急陰股中疼悶不省人事舶上茴香用鹽炒枳殼各一兩沒藥半兩上為末每服一錢溫熱酒下不計時候並二三服金針丸亦名陸神丸治陽絕痞氣心腹痛不可忍者丁香木香乳香阿魏輕粉骨碎補去毛檳榔官桂桂心巴豆去皮杏仁去皮石灰末肉豆蔻陽起石硃砂各等分上為細末水麵糊為丸如小豆大每服一丸針穿作孔子小油內滾過燈焰內燎遍於油中蘸死嚼生薑湯下不計時候日三服虛實加減一粒金丹治腰膝走注疼痛如虎齧草烏頭五靈脂各一斤木鱉子四兩白膠香半斤地龍四兩去土炒細墨一兩乳香一兩當歸二兩焙沒藥二兩麝香一錢上為末再研一千下糯米麵糊和丸每服一丸至二丸溫酒下吃藥罷遍身微汗神驗沒藥散治一切心腹疼痛不可忍者沒藥乳香別研乳香各三錢穿山甲三錢炙木鱉子四錢上為細末每服半錢一錢酒大半盞同煎溫服不計時候痔瘻門痔瘻總論夫腸風痔病者所發手太陰陽明經以應經脈謂肺與大腸為表裡主為傳道以行糟粕腸風痔病有五種其證亦異蓋因腸氣虛而玄府疏風邪乘而熱自生風溫邪熱攻於腸中致使大便澀而燥熱鬱血熱散而流溢沖浸浚腸里故以先血後便熱在下先便後血熱在上先血後便久而不愈乃作痔素問云因而飽食筋脈橫解房室勞傷腸癖為痔風熱不散穀氣流溢傳於下部故令肛門腫滿結如梅李核甚者而變成瘻也五臟切宜保養勿令受邪香殼丸治濕熱內甚因而飽食腸癖成痔久而成瘻者服之悉愈木香黃柏各三錢枳殼去穰炒厚朴各半兩黃連一兩蝟皮一個燒當歸四錢荊芥穗三錢上為末麵糊為丸如桐子大每服二三十丸溫水食前日三服榼藤子丸治腸風瀉血濕熱內甚因為諸痔久而不治乃變成瘻黃耆枳實槐花荊芥穗鳳眼草以上各一兩榼藤子一對炙皂子三百個炙上為細末麵糊為丸如桐子大每服二三十丸空心酒下米飲亦得忌油膩冷豬魚臭血物等烏荊丸治腸風痔疾大腸閟澀川烏頭二兩炮荊芥穗四兩上為末醋麵糊為丸如桐子大每服二三十丸溫水下日三服黃耆葛花丸治腸中久積熱痔瘻下血疼痛黃耆葛花黃赤小豆花各一兩大黃赤芍藥黃芩當歸各三分蝟皮一個檳榔白蒺藜皂角子仁炒各半兩生地黃焙一兩上為末煉蜜和丸如桐子大每服二十丸至三十丸煎桑白皮湯下食前槐子煎湯下亦得黃連散治腸風下血疼痛不止雞冠花黃連貫眾川大黃烏梅各一兩甘草三分炙上為末每服二錢用溫米飲調下日三服不計時候乳香沒藥散治五種腸風痔瘻無問久新宣黃連白礬各一兩穀精草半兩酸石榴一個用刀子割下蓋子裡面取子三停一停次將黃連白礬碎納入石榴內用原蓋子合用上以濕紙一張裹石榴裹了後用膠泥拍作餅子以炭火燒通赤為度取出去泥紙後將穀精草於銚子內炒焦黃為度與石榴研細後抄藥末一錢乳香一錢沒藥一錢研細拌勻每服一錢酒小半盞調下日三服木香厚朴湯治痔瘻脫肛腸胃間冷腹脅虛脹不思飲食木香桂心桃仁陳皮厚朴各一兩肉豆蔻赤石脂各半兩皂角子三兩去皮於醋炙黃大附子三分炮上為末每服二錢溫粥飲調下食前瘧疾門瘧疾總論素問云痎瘧皆生於風其蓄作有時何氣使然夫陰陽上下交爭虛實相移也陽並於陰陰實陽虛寒慄鼓頷此皆夏傷於暑熱氣藏於皮膚之內腸胃之外腠理開得秋氣汗出遇風得之與衛氣並衛氣晝行陽夜行陰氣得陽外出得陰內薄外內相薄是以日作也其有間日者氣深內薄於陰陽氣獨發陰邪內著陰與陽爭不得出是以間日作也其作晏與早者邪氣客於風府循膂而下衛氣一日一夜大會於風府其日下一節先客於脊背每至風府則腠理開腠理開則邪氣入則病作晏也夫寒者陰氣也熱者陽氣也先傷寒而後傷風故先寒而後熱名曰寒瘧先傷於風後傷寒故先熱而後寒名曰溫瘧其但熱而不寒者陰氣先絕陽氣獨勝少氣煩冤手足熱欲嘔名曰痹瘧有餘則瀉不足補熱為有餘寒為不足寒已得火不能溫熱已冰水不能涼陰勝並於陽陽勝並於陰陰勝則寒陽勝則熱故瘧者陰陽風寒虛實邪氣不常之所作也辟邪丹治嵐瘴鬼瘧食瘧並月頻日者綠豆雄黑豆各四十九粒信砒半錢別研黃丹一錢為衣硃砂二錢上為末同入乳缽內滴水為丸分作三十粒每服一粒已用東南桃心取七枝研汁將井花水早辰日出不出向日吞之醋湯亦得已發日服斬邪丹治諸般瘧疾無時不止者綠豆小豆各三十粒口退皮再入硃砂信砒各一錢上為末同研細滴水和丸勻分作十丸每服一丸已早辰服夜間於北斗下香水獻至早晨用新倒流水送下斷魔如聖丹治瘧疾不問久新信砒一錢蜘蛛大者三個雄黑豆四十九粒上為末滴水和丸如豌豆大如來日發於今晚夜北斗下獻於早晨已紙裹於耳內扎一丸立見愈神聖一粒可醫三人辰砂丸治一切脾胃虛瘧邪熱毒者信砒甘草各一錢硃砂三錢大豆四十九粒上為末滴水和丸勻分作四十丸服發日早晨日欲出煎桃心湯下忌熱物瘧神丹治諸般瘧疾信砒一兩雄黃一錢上以於五月重五日用棕子尖拌勻研三千下日未出不令雞犬婦人見丸如桐子大未發前一日面東冷水下一丸趁鬼丹治一切瘧疾神效信砒一錢大豆七錢雄黃輕粉荷葉各半錢甘草一寸上為末滴水為丸如小豆大重午日未出不見雞犬婦人修合每服一丸無根水下平日夜視北斗來日服忌熱物
