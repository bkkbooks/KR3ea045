body:
  text: 卷七積聚門積聚總論素問曰積聚留飲痞膈中滿濕積霍亂吐下癥瘕堅硬腹滿皆太陰濕土乃脾胃中氣積聚之根也積者不散聚者不化留者不行飲者停滯痞者不通隔者阻也中滿者濕為積霍亂吐下留停為聚癥者徵也瘕者假也斯疾乃五臟六腑陰陽變化盛衰之制也亢則害承乃制極則反矣謂水得燥則消散而得濕則不消乃為積飲也謂人形精神與營衛血氣津液出入流通謂夫腠理閉密乃為痞也謂腸胃膈絕傳化失常而乃滯也土主形體腹滿於中央乃曰中滿以傳化失度故甚則霍亂吐瀉也症者腹中堅硬按之應手然水體柔順而今反堅硬如地者亢則害承乃制也瘕者中雖硬而忽聚忽散無其常故其病未及癥也經曰血不流而滯故血內凝而乃瘕也小腸移熱於大腸乃為虙瘕大腸移熱於小腸謂兩熱相摶則血溢而為伏瘕血澀不利月事沉滯而不行故行為虙瘕為虙與伏同瘕與疝同為傳寫誤也世傳冷病然瘕病亦有熱或陽氣鬱結怫熱壅滯而堅硬不消者世傳為寒癥瘕也或堅痞腹滿急痛寒主筋縮故急主痛寒極血凝泣而反兼土化制之故堅痞之腹滿或熱鬱於內而腹滿堅結痛不可忍者皆可為寒誤矣誤矣何不以脈辨之凡諸疾病皆有陰陽寒熱宜推詳之五臟六腑四季皆有積聚心之積名曰伏梁在於臍上大如臂上至於心橫於心下如屋梁故曰伏梁肝之積名曰賁音奔氣在左脅下覆如杯有頭足久不愈令人痎瘧脾之積名曰痞氣在胃脘覆大如杯久不愈令人四肢不收發黃疸食不為膚肌肺之積名曰息賁結在右脅下覆大如杯久不愈令人灑淅寒熱喘咳發為肺癰腎之積名曰賁音奔㹠在於小腹上至心下如㹠奔走往來無定久不愈令人喘逆發為骨痿少氣乏力此為五臟之積也常究斯義未可悉也傳其所勝者死傳不勝者可治假令肺病傳肝肝病傳脾脾病傳腎腎病傳心心病傳肺皆傳所勝五臟之氣虛而內外諸邪所侵故留稽不行遂成積聚其脈沉細而微者是也木香三稜丸治一切氣悶胸膈痞滿營衛不和口吐酸水嘔逆噁心飲食不化肋脅疼痛無問久新青木香破故紙茴香黑牽牛甘遂芫花大戟荊三稜蓬莪朮川楝子胡蘆巴巴戟以上各一兩巴豆去皮不出油二分陳米三合將巴豆一處同炒黑縮砂仁一兩半上件一十五味用好醋二升除砂仁木香余藥入醋中浸一宿入鍋煮醋盡為度干為細末醋麵糊和丸如綠豆大每服五七丸食後加減看虛實隨湯水下導氣枳殼丸治氣結不散心胸痞痛逆氣上攻分氣逐風功不可述枳殼去穰麩炒木通銼炒青皮去皮陳皮去白桑白皮銼炒蘿蔔子微炒黑牽牛炒莪朮煨茴香炒荊三稜煨各等分上為末生薑汁打麵糊為丸如桐子大每服二十丸煎橘皮湯下不計時候透膈寬腸散治腸上壅實膈熱難行者白牽牛一兩芒硝三兩川大黃二兩甘遂半兩上為末食後溫蜜水調下一錢虛實加減疏動止密補固真丹治脾腎真元損虛泄利痰嗽噦痞水穀酸臭飲食無味臍腹冷痛肢體麻痹下虛痿厥上實壅滯腎虛耳鳴脾虛困憊耳焦齒稿面黧身悴目黃口燥發墮爪退風虛遍枯中滿膈氣一切脾胃虛證常服補養宣通氣血天南星半兩半夏制神麯麥糵茴香炒荊三稜炮各一兩白附子乾生薑川烏頭生各一兩巴豆七個牽牛三兩代赭石二兩官桂一分上為末水和丸小豆大每服十丸加至五十丸溫水下除泄瀉外並加大黃一兩木香丸治和脾胃寬胃膈消痰逆止嘔吐進益美飲食官桂乾薑各半兩木香一分大黃蓬莪朮芫花醋拌濕炒乾枳殼去穰陳皮各半兩半夏二兩牽牛半斤取末四兩茴香一兩炒巴豆四個上為末滴水為丸如小豆大每服二三十丸溫水下軟金丸治心胸腰腹急痛或淋閟併產後經病血刺腹痛當歸半兩乾漆二錢紅花一錢半用輕粉硇砂粉霜各一錢三稜二錢上同研勻棗肉為膏和丸綠豆大新汲水下一丸病甚者加得利後減泥金丸治心腹急痛取久新腸垢積滯推陳致新黃柏大黃巴豆五靈脂各半兩豬牙皂角一分輕紛粉霜硇砂各一分乾漆二分上研勻煉蜜拌得杵千下丸綠豆大新汲水下一丸未利更加服狀元丸治膈氣酒膈酒積腹痛吐逆痞滿巴豆五十個取霜神麯半兩末半夏一兩洗雄黃白麵炒各一兩上研勻滴水丸小豆大細米糠炒變赤色食後溫水下童子二丸三四歲一丸歲半半丸止嗽溫齏汁下止嘔吐生薑湯下玄胡丸治積聚癥瘕解中外諸邪所傷玄胡索青皮去白陳皮去白當歸木香雄黃別研荊三稜生薑各一兩上為末酒麵糊為丸如小豆大每服五七丸生薑湯下又一方無陳皮生薑有廣朮一兩檳榔分兩同大延胡索散治婦人經病產後腹痛腹滿喘悶癥瘕癖塊及一切心腹暴痛延胡索當歸芍藥荊三稜川苦楝蓬莪朮官桂厚朴木香川芎各一分桔梗黃芩大黃各半兩甘草一兩檳榔二錢上為粗末每服三錢水一盞煎至六分去滓熱服食前如惡物過多去大黃官桂加黃藥子染槐子龍骨各半兩如前法煎服平人心痛加本方得利尤良後常服三稜湯治癥瘕痃癖積聚不散堅滿痞膈食不下腹脹荊三稜二兩白朮一兩篷莪朮半兩當歸半兩焙木香三錢右為末每服三錢沸湯點服食後每日三服消飲丸治一切積聚痃癖氣塊及大小結胸不能仰按天南星半夏芫花自然銅生用各等分上為末醋煮麵糊為丸如桐子大每服五七丸食前溫水下良久蔥粥投之相虛實加減除濕丹治諸濕客摶腰膝重痛足脛浮腫筋脈緊急津液凝澀便溺不利及癮疹癰疽發背疥癬走注腳氣無首尾瘡癤功效不可盡述檳榔甘遂威靈仙赤芍藥澤瀉葶藶以上各二兩乳香沒藥各一兩別研黑牽牛半兩大戟二兩炒陳皮四兩去白上為末麵糊為丸如桐子大每服五十丸至七八十丸溫水下後食如服藥前後忌酒一日藥後忌濕面食溫粥補暖保安丸治癥積心腹內結如拳漸上不止搶心疼痛及繞臍腹痛不可忍者川大黃三兩新汲水浸一宿蒸熟切片子焙乾薑一兩炮大附子半兩去皮臍鱉甲一兩半好醋一升伏時炙令黃色妙上為末取三年米醋一大升先煎四五合然後和藥丸如桐子大每服十丸至二十丸空心醋或酒米飲下後取積如魚腸膿血爛肉汁青泥當下開結妙功丸治怫熱內盛痃癖堅積腸垢癥瘕積聚疼痛脹悶發作有時三焦壅滯二腸閉結胸悶煩心不得眠咳喘噦逆不能食或風濕氣兩腿為腫脹黃瘦眼澀昏暗一切所傷心腹暴痛風熱燥郁偏正頭疼筋脈拘瘓肢體麻痹走注疼痛頭目昏眩中風遍枯邪氣上逆上實下虛腳膝麻木冷痛宣通氣血荊三稜炮茴香炒各一兩川烏頭四兩神麯麥糵大黃各一兩好醋半升熬成稠膏不破堅積不須熬膏水丸乾薑二錢巴豆二個破堅積用四個半夏半兩桂二錢牽牛三兩上為末丸小豆大生薑湯下十丸十五丸溫水冷水亦得或心胸間稍覺藥力暖性卻加丸數以加至快利三五行以意消息病去為度木香分氣丸治積滯痞塊不消心腹痞結疼痛搶刺如覆杯狀陳皮去白檳榔各一兩破故紙二兩炒木香一兩半黑牽牛十二兩炒香熟取末五兩半余不用上為末滴水為丸如桐子大每服二三十丸生薑湯下食後臨臥服開胃生薑丸治中焦不和胃口氣塞水穀不化噫氣不通噎塞痞滿口淡吞酸食時膨脹噦逆噁心嘔吐痰水宿食不消咳嗽脅肋刺痛寬中開胃進飲食桂心一兩生薑一斤切作片子監三兩醃一宿再焙乾青皮去白陳皮去白甘草炙各二兩縮砂仁四十九個廣朮當歸各半兩右為末煉蜜為丸如彈子大每服一丸食前細嚼沸湯化下導滯定功丸治一切心腹卒暴疼痛及胸中不利消食止逆定疼痛大椒木香各一錢蠍梢三錢巴豆八個出油為度上為末後入巴豆霜研勻麵糊和丸如綠豆大硃砂為衣每服五丸至十丸淡醋湯下積氣丹治一切新久沉積氣塊面黃黑瘦諸氣無力癥瘕積聚口吐酸水檳榔二個芫花一兩碙砂二錢巴豆二錢半生青皮去白陳皮各三兩蓬莪朮雞爪黃連荊三稜章柳根牛膝各一兩肉豆蔻三個大戟川大黃甘遂白牽牛乾薑青礞石乾漆各半兩木香二錢半石菖蒲三錢右為末醋麵糊和丸如桐子大每服一丸臨臥燒棗湯下每夜一丸服後有積者肚內作聲病退為度金露紫菀丸治一切脾積兩肋虛脹臍疼痛草烏頭去皮尖生黃連各半兩官桂桔梗乾地黃乾生薑川椒蕪荑紫菀去皮柴胡防風厚朴甘草人參川芎鱉甲醋浸貝母枳殼去穰甘遂各一兩巴豆三兩醋煮半日出油硇砂三錢上為末水煮麵糊為丸如桐子大每服五丸空心臨臥米飲湯下或微疏動詳虛實加減信香十方青金膏灌頂法王予所傳十二上願云藥師琉璃光如來應當供養正遍知明行足善遊世間解無上士調御丈夫天人師佛世尊方境授治周身中外陰陽不調氣血壅滯變生百病乃至虛羸困倦偏攻酒食內傷心腹滿塞急痛或酒積食積癥瘕積聚痃癖堅積中滿膈氣食臭酸醋嘔吐翻胃或膈癉消中善食而瘦或消渴多飲而數色角切頻也小便或腸風下血痔瘻癢痛或胃癰疹或遍身癰疽惡瘡或瘡毒已入於裡腹滿嘔吐或成瀉痢或出惡瘡瘜肉或下利腹痛或一切風氣肢體疼痛及中風偏枯或痰逆生風痰涎嗽兼產後腹痛及小兒疳積諸風潮搐但平人常服保養宣行營衛調飲食信砒乳香輕粉粉霜巴豆以上各一兩同研龍腦半字麝香半字青黛二錢同研黃蠟三錢上研細末熔蠟入蜜半錢就搓勻旋丸綠豆至小豆大先服小丸病在上食後在下食前在中不計時候面東頂禮一丸淨器盛水送下如合藥即淨處面東每一丸密唸咒三遍或病人不能咒請人咒或師氏咒過咒曰信香十方青金膏藥師丸成蜜遍拋普濟有緣除百病常吞一粒體堅牢密咒曰但言八金剛莫說十方佛五蘊六根俱不道十二上願自然成金黃丸治酒積食積諸積面黃疸積硬塊荊三稜香附子各半兩澤瀉二錢半巴豆四十九粒出油黍米粉牽牛各二錢半上為末用梔子煎湯和丸如綠豆大每服三丸至五丸如心痛艾醋湯下七丸導氣丸治心胸滿悶脅肋刺痛不思飲食常服寬膈進美飲食薑黃四兩香附子四兩縮砂甘草廣朮各二兩丁皮甘松木香荊三稜各一兩白檀半兩藿香葉半兩上為末入綠豆粉二兩用湯浸蒸餅為丸如桐子大每服三二十丸細嚼白湯下食後日進三服丁香散治痃癖氣脅下痞滿息而不消積而不散元氣在胃不妨飲食好丁香二十五個白丁香七十個密陀僧舶上硫黃黃鶯調各五分上為細末每服一字皂子煎湯調下不計時候治肚內生硬物黑瘦如柴嘔吐積滯日三服食後聖餅子治一切沉積氣脹兩脅氣滿無問新久者大黃三兩黑牽牛頭末一兩碙砂三錢山梔子半兩輕粉二錢上為末煉蜜和丸捻作餅子如小錢大厚樣食後每服三餅子細嚼溫酒下臨臥如行粥補之虛實加減無憂散一名萬病散治風疾瘡腫疥癬或臟腑積冷壅滯氣結風勞膀胱宿冷臟腑虛衰面色痿黃內有癥癖氣並當有疳蟲蛔蟲攻心腹俱痛忽中傷寒頭痛不忍狀若山嵐時氣瘟疫之疾並宜急服此藥宜通三五行立瘥或中風口喎語多謇澀睡後口中涎出不限時節不問男子女人但五日一服不過三服永瘥人患腰膝疼痛腳氣腫滿運動艱難飲食無味並小兒疳痢脫肛者量大小與服利三五行自瘥大人久泄氣痢狀若休息痢止有時俱一服取下冷膿一二升當日見效藥無四時冷熱老幼衰弱病患悉皆除之任服他藥無妨若服常時蓋緣搜出臟腑中積滯蟲膿故也無孕婦人久患血虛氣弱痿黃無力者亦可依方服宣通氣血殊不困倦無妨此藥凡有百病並皆治之其功不可具載有孕婦人或遇陰晦時即不可服天道晴明可進若雖復疾而未愈者可再服黃耆木通桑白皮陳皮各一兩胡椒白朮木香各半兩白牽牛四兩炒別取頭末上七味為細末每服二錢牽牛末二錢生薑二錢切作片子煎生薑湯一大盞調藥須臾又用生薑湯或溫湯送下平明可行三五次快利無妨如病瘥後以白粥補之痊矣五積丹治心腹痞滿嘔吐不止破積聚者皂莢一梃一尺二寸火燒留性淨盆合之四面土壅合勿令出煙巴豆十二個白麵一兩五錢同炒令黃色為度上為末醋麵糊為丸綠豆大每服十丸鹽湯下食後加減
