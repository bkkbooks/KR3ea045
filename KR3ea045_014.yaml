body:
  text: 卷十四眼目門眼目總論素問云目得血而能視手得血而能握其證足厥陰之經絡所主肝臟受虛而即補腎實而即瀉心夫人之眼目者似天地之日月也若人無雙目豈能辨別賢愚天無日月萬物安得照耀是故眼通五臟氣貫五輪外應肝候肝藏虛而風邪郁風邪鬱而熱蘊沖火炎上行故攻目目昏滲澀疼痛赤絲皆發營衛實則能視營衛虛則昏暗凡人餐熱物或嗜五辛坐濕當風凌寒冒暑將息失度皆喪目之源也黃連膏治一切眼目痛瘀肉攀睛風癢淚落不止朴硝一斗以水半鬥淘淨去土陰乾用黃連半斤白丁香五升以水一斗淘淨去土攪細用上取水入硝香釜內熬至七分淘出令經宿水面浮牙者取出控干以紙袋子盛風中懸至風化將黃連細末熬清汁曬乾稍用豬羊膽和加蜜妙點之妙矣滌昏膏治一切風眼疼痛不可忍者洗之妙矣好崖蜜一斤黃連一兩沒藥半兩黃丹一兩炮紫色上入蜜同熬黑煎黃連成稠汁黃丹入藥內煎熬稠更入沒藥末同熬數沸濾去滓洗甚妙後更用通天散㗜鼻通天散治偏正頭疼並腦風通一切壅滯明目赤芍藥川芎黃連黃芩玄胡索草烏頭當歸乳香別研各等分上為細末每服少許紙捻子蘸藥任之鼻㗜神效神芎散治風熱上攻頭目眩痛上壅鼻塞眼昏並牙齒悶痛川芎鬱金各二錢荊芥穗一分薄荷葉一分盆硝二錢紅豆一錢以上為細末後入盆硝上研勻鼻內㗜三兩耳剜力慢加藥病甚者兼夜㗜之凡熱多風少隨證選用諸藥金絲膏治一切目疾昏暗如紗羅所遮或疼或痛宣黃連半兩銼碎水一盞浸一宿取汁再添水半盞浸滓經本日許取汁與前汁放別用水半盞蜜一兩白礬一字井鹽一分如無以青鹽代之山梔子二錢好者捶碎與黃連滓同煮五七十沸取盡力了濾去滓與前黃連汁一處入余藥上用銀瓷器內同熬十餘沸用生絹上細紙數重再濾過用時常點白藥子散治一切疳眼爛目生翳眼內外障赤疾並小兒吐利疳瀉白藥子一兩甘草半兩上為末用豬肝一葉批開糝藥五錢水一大盞煮熟食後服胡黃連散治一切久新赤目疼痛不能坐臥並大小人口瘡胡黃連檳榔各半兩麝香少許別研上為細末研細點之如口瘡每服半錢麝香一字勻口瘡大小貼之忌食魚豬油膩物碧霞丹點一切惡眼風赤者龍腦麝香硇砂各二錢血竭沒藥乳香銅青各一錢鵬砂三錢上為末滴水和丸如桐子大每服一丸新汲水化開點之立效菩薩散治遠年近日一切眼疾菩薩石金精石銀金石太陰石太陽石雨余石河洛石礬礦石雲母石爐甘石井泉石白滑石紫英石寒水石陽起石豬牙石代赭石碧霞石烏魚骨青鹽各一兩硇砂半兩密陀僧一兩銅青一兩黃丹四兩麝香腦子各一錢輕粉一錢半硼砂三錢乳香二錢熊膽一斤白砂蜜二斤上為細末以井花水九大碗熬就作四碗點水內落下錢許大不散可如散者再熬濾滓過露旋點石膏羌活散治久患雙目不睹光明遠年近日內外氣障風昏暗拳毛倒睫一切眼疾羌活治腦熱頭風密蒙花治羞明怕日木賊退翳障香白芷清利頭目細辛乾菜子二味起倒睫麻子起拳毛川芎治頭痛蒼朮明目暖水藏甘菊花荊芥穗治目中生瘡黃芩洗心退熱石膏二味藁本治偏正頭痛甘草解諸藥毒各等分上為末每服一錢至二錢食後臨臥用蜜水一盞調下或清茶或淘米第二遍泔亦得日進三服至十日漸明服至二十日大驗此方醫數十餘人矣重明散治一切風熱內外障氣眼疾川獨活川羌活川芎吳射干仙靈脾防風甘草井泉石蒼朮各半兩丹參白朮石決明各三錢上為末每服二錢水一盞半煎至一盞溫服日進二服食後雷岩丸治男子婦人肝經不足風邪內乘上攻眼暗淚出羞明怕日多見黑花生障遮睛瞼生風粟或癢或痛隱澀難開兼久患偏正頭疼牽引兩目漸覺細小視物不明皆因腎水不能溉濟於肝木此藥久服大補腎臟添目力肉蓯蓉一兩牛膝一兩巴豆一兩浸一宿去皮心菊花二兩黑附子一兩去皮臍青鹽二錢以河水三升同煮為度枸杞子二兩川椒三兩去目上為末元浸藥酒煮麵糊為丸如桐子大每服十丸空心酒下世人服藥不知多少根源往往不效耳丁香復光丸治一切遠近目疾丁香二錢巴豆一錢去皮油半夏二兩烏梅半兩去核南硼砂三錢腦子二錢盆硝半兩縮砂仁二錢半甘草半兩荊芥穗二錢上為末醋煮麵糊為丸如緑豆大每服十丸至十五丸米泔下食後日三服以上諸方系先生親驗可録小兒門小兒病總論素問云身熱惡寒戰栗驚惑皆屬熱證為少陰君火暴強直肢緛戾裡急筋縮也皆屬風證為厥陰風木火小兒六歲之上為小兒十八歲以上為少年其六歲以下者諸經不載是以乳下嬰兒有病難治無可定也然小兒與大人不可一例各異治之雖小兒誕生襁褓之後骨肉脆軟腸胃細微可以乳食調和臟腑乃得平安肌膚滋潤筋骨輕嫩以綿衣之故生壅滯內有積熱熱乘於心心受邪熱乃發為驚驚不止反為潮搐則為病也大概小兒病者純陽多熱冷少故引素問少陰厥陰證以小兒病驚風熱多矣小兒驚風者皆由心火暴甚而制金金不能平木故風火相搏而昏冒驚悸潮熱此證皆謂熱甚而生風素問驚駭驚悸少陰君火也小兒脾疳利瀉者皆熱甚急驚瀉利色多青為熱證明矣利色黃者何為火甚則水衰而睥土旺故利色黃也利色赤紅者為心火熱甚深也利色黑者為火熱過極則反兼水化制之故色黑也五臟皆言熱證無寒冷證亦有謂瀉利小便青白不澀為寒水穀不化而色不變吐利腥穢澄徹清冷白不澀身涼不渴脈遲細而微者寒證也穀雖不化而色變非白煩渴小便赤黃而澀者為之熱證世傳大人小兒吐利霍亂食乳未及消化而利尚白便言論為寒證誤矣向不脈候別之仲景邪熱不化谷豈為寒也大人也同龍腦地黃膏治小兒急慢驚風痰涎上潮心胸天吊驚悸喉風小兒胸膈不利一切熱毒大有神驗如病不已與分肢散一二服吐利得快常服此藥川大黃別搗甘草橫紋者別搗麝香一錢別研雄黃水窟者一分別研生腦子一錢別研上五味各修制了再入鉢內同研細煉蜜為膏油單裹旋丸如皂子大化下如有前病煎薄荷湯下如小兒大人睡驚及心神恍惚煎金銀湯下一丸常服新汲水下大解暑毒如孕婦人常服新生男女永無疾病如有大人陽毒傷寒加輕粉二匣子龍腦少許水化下一丸杏核大小兒看年紀大小加減服立效分肢散治小兒卒風大人口眼喎斜風涎裹心驚癇天吊走馬喉痹急驚一切風熱等疾巴豆半兩不出油川大黃一兩朴硝半兩上大黃為末後入巴豆朴硝一處細研用油貼起如有前患每服半錢熱茶下吐下頑涎立愈如小兒胸喉驚吊等先服龍腦地黃膏一服次服此藥一字茶下時上吐下瀉微瀉以吐利得快為效大人半錢小兒一字看虛實加減只是一兩服見效不宜常服如吐瀉不定以蔥白湯立止珍珠丸治小兒虛中積熱驚癇等疾巴豆霜膩粉各二錢滑石三錢天南星一錢半蠍梢二十四個續隨子二十四個粉霜一錢半上為末研令極細以糯米粥為丸如黃米大小兒二歲以下每服一丸至三丸十五歲每服五丸至十丸點茶湯下荊芥湯亦得虛實加減朱黃散治小兒上焦壅熱諸眼疾肉桂鬱金各一兩馬牙硝四兩甘草半兩並生上為末每服一錢新汲水調下重枕臥片時若是小兒十歲服半錢五歲以下服一字永無驚疳癇風患服之立效如患眼三五年吃三五兩便瘥硃砂丸治小兒急慢驚風及風熱生涎咽喉不利取驚積硃砂天南星巴豆霜各一錢上為末麵糊和丸如黍粒大看病虛實大小每服二丸或天吊戴上眼每服四五丸薄荷水下立愈鬱金散治小兒急慢驚風等疾鬱金一枚大者巴豆七個去皮不出油上研為細末每服一字煎竹葉湯放溫下把藥抄盞唇上放以湯充下喉咽為妙澤瀉散治小兒齁䶎膈上壅熱涎潮澤瀉一分蟬殼全者二十一個黃明膠手掌大一片炙令焦上為細末每服一大錢溫中湯調下日進二服未愈再服鎮庭散治小兒一切驚喘肚脹咳嗽鬱金大黃各半兩甘草三錢輕粉一錢上為末每服半錢用薄荷汁硃砂細研冷水以木匙瀝下定命散治小兒天吊驚風不能哭泣藜蘆川芎鬱金各等分上研為細末鼻中㗜之如哭可醫金肺散治小兒諸般喘嗽急驚風神效錫灰一錢漢防己二錢鬱金一錢半砒黃二錢半夏一錢半湯洗七次上為細末每服半錢加至一錢小兒加減煎豬肉湯下日進二服食後厚朴散治小兒虛滑瀉利不止厚朴訶子皮各半兩使君子一個揀丁香十個茯苓吳白朮青皮各二錢甘草一寸炒上為末每服一宇一歲加減用清米湯下人參散治小兒虛熱煩渴因吐瀉煩渴不止及疏轉後服之人參半兩茯苓二兩半牛膝二錢半甘草半兩甘葛半兩桔梗二錢半上為末每服二錢水一大盞入燈心五莖同煎至六分放溫不計時候煩熱者以新竹湯下量年紀加減碧雲散治小兒驚風有痰膽礬半兩研銅青一分研粉霜輕粉各一錢上為細末每服一字薄荷湯下中風將水下如吐多不定煎蔥白湯投之立止效桃符丸治小兒風熱大黃郁李仁黃柏宣連鬱金各一分巴豆二七個去皮出油為霜輕粉二錢上為末滴水為丸如緑豆大以硃砂為衣每服二丸用桃符煎湯下看大人小兒加減
