body:
  text: 卷五傷寒門傷寒總論主療說傷寒表證當汗而不可下里證當下而不可汗半在表半在裡則當和解不可發汗吐下在上則通之在下則泄之傷寒無汗表病里和則麻黃湯汗之或天水散之類亦佳表不解半入於裡半尚在表者小柴胡湯和解之或天水涼膈散甚良表裡熱勢俱甚者大柴胡湯微下之更甚者大承氣湯下之表熱多裡熱少者天水一涼膈半和解之裡熱多表熱少未可下之者涼膈一天水半調之熱更甚者小承氣湯下之表證解但有里證者大承氣湯下之凡此諸可下者通宜三一承氣湯下之發汗不解下後前後無異證者通宜涼膈散調之以退其熱兩感仿此而已傷風自汗表病里和者桂枝湯解肌半在表半在裡白虎湯和解之病在裡者大承氣湯下之一法無問風寒暑濕有汗無汗內外諸邪所傷但有可下諸證或表裡兩證俱不見而日深但目睛不了了睛不和者或腹滿實痛者或煩渴或譫妄或狂躁喘滿者或蓄熱極而將死者通宜大承氣湯下之或三一承氣湯尤良傷寒大發汗汗出不解反無汗脈虛浮者蒼朮白虎湯再解之或中暑自汗大出脈虛弱頭痛口乾倦怠煩躁或時惡寒或畏日氣無問表裡通宜白虎或裡熱勢甚腹滿而脈沉可下者宜大承氣湯或三一承氣湯傷寒表熱極甚身疼頭痛不可忍者或眩或嘔里有微熱不可發汗吐下擬以小柴胡天水涼膈之類和解恐不能退其熱勢之甚或大下後再三下後熱勢尚甚不能退本氣損虛而脈不能實擬更下之恐下脫而立死不下亦熱極而死寒涼之藥不能退熱勢之甚者或熱濕內余下利不止熱不退者或因大下後熱退利不止熱不退脈弱氣虛不可更下者或諸濕熱內余小便赤澀大便溏泄頻並少而急痛者必欲作利也須宜黃連解毒湯或裡熱極甚而恐陰氣不能退者或已下後熱不退者或蓄熱內甚陽厥極深以至陽氣沉伏而不能營運於身陰欲絕而以致遍身青冷痛甚不堪項背拘急目赤睛疼昏眩恍惚咽乾或痛燥渴虛汗嘔吐下利腹滿實痛煩痞悶亂喘息急聲脈雖疾數以其蓄熱極探而脈道不利以致脈沉細而欲絕俗未明其造化之理而反傷熱寒極陰毒者或始得之陽熱暴甚而便有此證者或兩感勢甚者通宜解毒湯加大承氣湯下之熱不退者再下之然雖古人皆云三下熱不退即死矣亦有按法以下四五次利一二十行熱方退而救活者免致不下退其熱而必死也下後熱稍退而未愈者黃連解毒湯調之或微熱未除者涼膈散調之或失下熱極以至身冷脈微而昏冒將死者若急下之則殘陰暴絕陽氣後竭而立死不下亦死當以涼膈散或者黃連解毒湯養陰退陽蓄熱漸以消散則心胸腹暖脈漸以生至陽脈復有力者方可以三一承氣湯微下之或解毒湯加大承氣湯尤良或下後微熱不解者涼膈散調之愈後但宜退熱之藥忌發熱諸物陽熱易為再作也論風熱濕燥寒諸風風本生熱以熱為本風為標言風者即風熱病也諸熱熱甚而生風或熱微風甚即兼治風熱或風微熱甚但治其熱即風自消也諸濕濕本土氣火熱能生土濕故夏熱則萬物濕潤秋涼則濕復燥干也濕病本不自生因於火熱怫鬱水液不能宣行即停滯而生水濕也凡病濕者多自熱生而熱氣尚多以為兼證當云濕熱亦猶風熱義同雖病水寒不得宣行亦能為濕雖有此異亦以鮮矣或跗腫體寒而有水者以為蓄熱入里極深本非病寒也及夫寒熱吐瀉因得濕而成也諸燥燥乾者金肺之本肺藏氣以血液內損氣虛成風則皴揭風能勝濕熱能耗液皆能成燥故經云風熱火兼為陽寒濕燥同為陰又燥濕亦異也然燥雖屬秋陰而其性異於寒濕燥陰盛於風熱也故風熱甚而寒濕同於燥也然中寒吐瀉亡液而成燥者亦以此矣故經云諸澀枯涸幹勁皴揭皆屬於燥也諸寒寒者上下所生水液澄澈清冷穀不化小便清白不澀身涼不渴本末不經有見陽熱證其脈遲者是也此因飲食冷物過多陰勝陽衰而為中寒也或冷熱相併而反陽氣怫鬱不能宣散怫熱內作以成熱證者不可亦言為冷當以熱證辨之夫濕熱吐瀉當見陽脈若亡液氣虛亦能反見諸陰脈也當以標本明之不可妄治或熱證誤服白朮調中湯溫藥亦能開發陽氣宣通而愈別無加害也傷寒表證夫傷寒之候頭項痛腰脊強身體拘急表熱惡寒不煩躁無自汗或頭而痛肌熱鼻乾或胸滿而喘手足指末微厥脈浮數而緊者邪熱在表皆麻黃湯發汗之證也或天水散之類甚佳傷寒表裡證傷寒身熱為熱在表引飲或小便黃赤為熱在裡身熱渴或小便黃赤為表裡俱有熱身涼不渴小便清白為表裡俱無熱身疼拘急表熱惡寒而脈浮者皆為熱在表也引飲譫妄腹滿實痛發熱而脈沉者皆為熱在裡也胸脅痞痛或嘔而寒熱往來脈在肌肉者邪半在表半在裡也內外傷始得病脈便沉而里病表和者內傷也脈浮而表病里和者外傷也病在身體頭面四肢為表病在胸腹之內為里病也傷寒論夫風寒者百病之始也是四時八節不正疫癘之氣故云春氣溫和夏氣暑熱秋氣清涼冬氣冰冷乃四時之正氣冬時嚴寒萬類深藏君子固密則不傷於寒觸冒之者乃傷耳春應暖而反寒夏應熱而反冷秋應涼而反熱冬應寒而反溫非時而邪氣是以辛苦之人一歲之中病無少長始自一日巨陽膀胱受之巨陽者三陽之首故先受之二日陽明胃受之三日少陽膽受之未入其臟可汗之四日太陰脾受之五日少陰腎受之六日厥陰肝受之其入藏可泄之經云其未滿三日汗之而已其滿三日泄之而已故聖人論汗下大概言之以脈分別三四日脈沉伏亦當下六七日脈浮滑亦可汗故傷寒傳足經不傳手經未詳耳且自人身十二經絡分布上下手足各有三陰三陽稟天地之氣天樞之上同天之陽天樞之下同地之陰至真要大論云身半以上其氣三矣天之分也天氣主之身半以下其氣三矣地之分也地氣主之注云當陰之分冷病歸之當陽之分熱病歸之有八節邪氣所中於人陽邪為病傳手經陰邪為病傳足經其邪自何入自風池而入為脊骨兩傍一寸五分足膀胱經之俞穴春夏應陽秋冬應陰至真要大論云寒暑溫涼盛衰之用其在四維故陽之動始於溫盛於暑陰之動始於涼盛於寒春夏秋冬各差其分易云水流濕火就燥熱論云熱病者皆傷寒之類也人之傷於寒則為病熱熱雖盛不死太陰陽明論云陽受風氣陰受濕氣注云同氣相求耳又曰傷於風者上先受之傷於濕者下先受之注云陽氣炎上故受風陰氣潤下故受濕蓋同氣相合耳故風熱火為陽寒濕燥為陰刺熱論云五臟俱有熱病肝熱病左頰先赤心熱病顏先赤脾熱病鼻先赤肺熱病右頰先赤腎熱病頤先赤甲乙經熱論云有手足太陰熱病有手足少陰熱病有手足厥陰熱病熱論其三陰三陽五臟六腑皆受病營衛不行五臟不通則死矣未嘗則傳足經不傳手經麻黃湯治傷寒頭痛發熱體痛惡風無汗而喘又治太陽病脈浮緊無汗發熱身疼八九日不解表證仍當發其汗其人發煩目瞑必衄衄者陽氣重也麻黃一兩半去節桂枝一兩去皮甘草半兩炙銼杏仁二十枚浸去皮尖上為末每服三錢水一盞半煎至八分去滓溫服不計時候衣覆以取汗或濕病身煩痛小便自利者加白朮四分微汗之桂枝湯治傷寒發熱惡寒乾嘔頭痛太陽中風陽浮陰弱解肌脈浮緊鼻鳴者桂枝三分去皮芍藥三分甘草三分上銼如麻豆大每服五錢水一盞半生薑三片棗三個煎至七分不計時候小青龍湯治傷寒表未罷心下有水氣乾嘔發熱而咳或渴利或小便不利小腹滿喘麻黃去節湯泡去黃汁焙乾三錢半夏湯洗芍藥細辛乾薑甘草炙桂枝去皮各三分五味子二錢上銼如麻豆大每服五錢水一大盞煎至半盞生薑棗同煎不計時候溫服渴者去半夏加栝蔞根三錢微利者去麻黃加芫花彈子大噫者去麻黃加附子三錢炮以開怫熱結滯小便不利小腹滿者去麻黃加茯苓四錢喘者去麻黃加杏仁大柴胡湯小柴胡湯瓜蒂散治傷寒表證罷邪熱入里結於胸中項不強腹滿而不能食四肢微厥而脈乍緊者宜以吐之經云在上者吐之在下者泄之瓜蒂赤小豆各等分上為末香豉半合豆豉是也水一盞半煮取汁半盞調下錢匕不吐加服五苓湯五苓散是也治傷寒中暑大汗後胃中干煩躁不得眠脈浮小便不利微熱煩渴及表裡俱熱飲水反吐名曰水逆或攻表不解當汗而反下之利不止脈浮表不解自利或一切留飲不散水停心下並兩感中濕而昏躁霍亂吐瀉驚風豬苓去皮茯苓去皮白朮各半兩桂一分去皮澤瀉一兩上為末每服二錢熱湯調下愈妙加滑石二兩甚佳喘嗽煩心不得眠者加阿膠半兩枯夏月大暑新水調服立愈
