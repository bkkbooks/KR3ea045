body:
  text: 卷十一婦人門婦人總論素問曰目得血而能視耳得血而能聽指得血而能攝掌得血而能握足得血而能步髒得血而能液腑得血而能氣然血所通流則氣亦然也血氣宣行其中神自清利而應機能用矣故素問氣血人之神也不可不謹調護然婦人以血藏為基本也婦人之病手太陽足少陰小腸心之經絡為表裡起自任沖之脈於中極之下以上毛際循腹裡關元上至咽喉頤循面目過帶脈貫臍而止以婦人月水一月一來如期謂之月信其不來則風熱傷於經血故血在內不通或內受邪熱脾胃虛損不能飲食食既不克營衛凝澀肌膚黃燥面不光澤或大腸虛變為下利流入關元致絶子嗣為子藏虛冷勞損而病帶下起於胞內夫帶下之造化但分經絡標本殊異為病之本氣也其病所發正在過帶脈之分而淋漓以下故曰帶下也赤白之説者無實已法曰頭目昏眩口苦舌乾咽喉不利小便赤色大便滯澀皆熱證也凡白帶下者亦多有之為病寒豈能素問亢則害承乃制謂亢過極而反兼勝己之化制其甚也則如火鍊金熱極則反化為水及六月熱極則物反出液而濕潤材木流津故肝熱則泣心熱則汗脾熱則涎肺熱則涕腎熱則唾大凡俗論以煎熱湯煮極則沸溢及熱氣里蒸於物而生津液也故下部任脈濕熱甚者津溢湧而溢以為帶下見俗醫白帶下者但依方論而用辛熱之藥雖有誤中致令鬱結熱聚不能宣通舊病轉加世傳誤之久矣人參白朮散治遍身燥濕相摶玄府緻密遂令忪悸發渴飲食減少不為肌膚人參三錢白朮七錢薄荷半兩縮砂仁三錢生地黃茯苓去皮甘草各半兩黃芩一錢滑石三兩藿香三錢半石膏一兩上為末每服三錢水一盞煎至六分去滓溫服食前日進二三服白朮湯治妊娠血液虛衰痿弱難以運動氣滯痹麻營衛不能通宣常服養液潤燥開通結滯令血昌盛白朮三兩寒水石當歸黃芩芍藥人參石膏乾葛防風縮砂仁川芎甘草茯苓各一兩木香一分崔宣武方用白朮一兩上為末每服三錢水一盞生薑三片同煎至六分去滓溫服食前日三服二氣湯治月水不調斷絶不産面黃肌瘦憔悴不美食燥熱以柴胡飲子相參服之大黃四兩別為末醋一升慢火熬成膏子當歸二兩白芍藥二兩上為末以膏子和丸如桐子大每服二十丸淡醋湯下食前日進三服如月水不通加入乾漆三錢炒出大煙沒藥半兩碙砂三錢研官桂二錢斑蝥三錢去翅足炒熟用本草云此用熬不可生用則吐瀉當歸龍骨丸治月事失常經水過多及帶下淋漓無問久新赤白諸證併産後惡物不止或孕婦惡露胎痛動不安及大人子兒痢瀉並宜用之當歸芍藥黃連染槐子艾葉炒各半兩龍骨黃柏各一兩茯苓半兩木香一分上為末滴水為丸如小豆大溫米飲下三四十丸食前日三四服當歸人參散治産後虛損痿弱難以運動疼痛胸滿不思飲食當歸白朮黃芩芍藥大黃茯苓去皮陳皮各半兩人參黃耆銼川芎厚朴去皮薑製官桂各三錢甘草一兩枳殼四錢去穰炒上為末每服三錢水一盞生薑三片煎至六分去滓不計時候溫服如大便祕以此散下和中丸增損四物湯治月水不調心腹疼痛補血藏溫經注顏川芎當歸芍藥熟地黃白朮牡丹皮各半兩地骨皮一兩上為末每服五錢水一盞煎至六分去滓溫服食前當歸川芎散治風壅頭目昏眩痛悶筋脈拘卷肢體麻痹保護胎氣調和營衛當歸川芎各半兩甘草二兩黃芩四兩薄荷一兩縮砂仁一分上為末溫水調下一錢漸加至二錢食後日進三服辰砂大紅丸治産後寒熱運悶血氣塊硬疼痛不止硃砂一兩一半入藥一半為衣附子炮沒藥半兩海馬半錢乳香蓯蓉肉桂玄胡薑黃硇砂各半兩斑蝥一分生地黃一兩上為末酒煮麵糊為九酸棗大每服一丸煎當歸酒下放溫經水不行煎紅花酒下三聖散治産後血利不止烏魚骨炒燒綿灰血餘炭汗脂者各等分上為細末每服一錢煎石榴皮湯調下熱服沒藥丹治産後惡血不下月候不行血刺腰腹急痛或一切腸垢沉積堅滿痞痛作發往來或燥熱煩渴喘急悶亂肢體痛倦大小人心腹暴痛孕婦自利惡物過多不宜服燥熱極甚血液衰竭不可強行宜調氣養血細詳證用沒藥一錢當歸大黃各一兩牽牛二兩輕粉一錢半官桂六分以上同研末硇砂一錢同研上研勻醋麵糊為丸如小豆大每服五丸至十丸溫水下以快利取積病下為度雖利後病未痊者後再加取利止心腹急痛煎乳香下未止取大便利黃藥子散治月事不止煩渴悶亂心腹急痛肢體困倦不美飲食黃藥子當歸芍藥生地黃黃芩人參白朮知母石膏各一兩川芎桔梗各一分甘草一兩紫菀槐花子柴胡各一分上為粗末炒三錢水一盞煎至七分濾汁溫服食前但一服大延胡索散治婦人經病併産後腹痛或腹滿喘悶或癥瘕癖塊及一切心腹暴痛延胡索當歸赤芍藥荊三稜川楝子蓬莪朮官桂厚朴木香川芎各一分桔梗黃芩大黃各半兩甘草一兩檳榔一錢上為末每服三錢水一盞煎至六分去滓熱服食前日三服惡物過多去大黃官桂加入黃藥子染槐子龍骨各半兩如前法或平人心胃急痛加本方煎服得利尤好枳實檳榔丸安養胎氣調和經候治癥瘕痞塊有似妊孕可以久服血氣通和兼寬膈美食枳實檳榔黃連黃柏黃芩當歸阿膠灰炒細研木香各半兩上為末水和丸如小豆大溫米飲下三十丸不計時候日進三服軟金花丸治心胸腰腹急痛或淋閟併産前後經痛刺痛乾嘔氣勞往來寒熱四肢困倦夜多盜汗者兼治血積食積當歸半兩焙乾漆二錢半輕粉斑蝥生全用為末硇砂粉霜各一錢巴豆二錢去油右為末同研細棗肉為膏旋丸如緑豆大每服一丸新汲水下病甚者加服看虛實加減大紅花丸治婦人血塊積聚癥瘕經絡阻滯川大黃紅花各二兩虻蟲十個去翅足上取大黃七錢醋熬成膏和藥丸如桐子大每服五七丸溫酒下食後日三服黃芩湯治婦人孕胎不安白朮黃芩各等分上為末每服三錢水二盞當歸一根同煎至一盞稍溫服海蛤丸治婦人小便濁敗赤白帶下五淋臍腹疼痛寒熱口乾舌澀不思飲食海蛤半夏芫花醋炒紅娘子去翅足訶子炒玄胡索川楝子麵裹煨去皮茴香炒各一兩乳香三錢硇砂半兩硃砂半入藥半為衣沒藥研各一兩當歸一兩半上為末醋煮麵糊為丸如小豆大每服五丸至十丸醋湯下量病人虛實加減烏金散治婦人諸疾寒熱頭痛一切等疾烏金子肉桂蒲黃當歸虻蟲血餘炭水蛭鯉魚炭木香青皮皂角大者炙各半兩芍藥半兩芫花三兩醋製巴豆一錢出油硃砂少許棕皮炭紅花各一兩川烏頭半兩上為末每服半錢加至一錢煎生薑湯調下空心食前忌油膩物伏龍肝散治婦人血崩不止或結作片者芎藭一兩生地黃一分阿膠八錢炙當歸一兩續斷一分地榆一兩刺薊根一兩伏龍肝七錢青竹茹八錢上為末每服三錢水一盞半煎至一盞溫服日五服不計時候後服補藥阿膠丸治婦人諸病阿膠鱉甲各六分續斷五分龍骨一兩半芎藭六分地膽四分鹿茸五分烏魚骨八錢丹參六錢龜甲一錢上為末醋麵糊為丸如桐子大每服三十丸艾湯下日進三四服麝香杏仁散治婦人陰瘡麝香少許杏仁不以多少燒存性上為細末如瘡口深用小絹袋子二個盛藥滿系口臨上藥炙熱安在陰內立愈硃砂斑蝥丸治婦人産後吃硬食變作血氣食塊無問久新皂角末二錢巴豆四個去油硃砂一錢硇砂一皂子大塊乾蠍一個全斑蝥十個紅娘子五個水蛭五個右為細末蜜和丸分作十五丸每服一丸至二丸三丸溫酒下初更吃平明取下血化水十年之病皆治之或大便或小便不多出也
