body:
  text: 卷六傷寒門抵當湯治傷寒日深表證仍甚蓄熱下焦脈微沉不結胸發狂者小腹脹而硬小便自和者瘀血證也小便不和無血也或陽明蓄熱內甚而喜忘或狂大便雖硬而反易其色黑者有蓄血也無表裡證但發熱日深脈雖浮者亦可下之或已下後脈數胃熱消穀善飢數日不大便有瘀血也桃仁七個大黃一分水蛭炒虻蟲去翅足炒各十個上銼如麻豆大分作二服水一盞煮至半盞絞去滓溫服未下再服抵當丸治傷寒有熱少腹滿小便不利者為有血也當下之不可余藥桃仁八個大黃一分水蛭炒虻蟲去翅足炒各七個上為末蜜和作二丸用水一盞煮一丸至六分溫服晬時血未下再服大承氣湯治表裡俱熱病勢更甚者陽明脈遲汗出不惡寒身重謂如見鬼狀劇者發則不識人循衣摸床惕而不安微喘直視陽明裡熱極甚或吐下後不解大便五六日至十餘日日晡潮熱心胃燥熱而懊憹復如瘧狀脈沉實或小便不利大便乍難乍易喘冒不能臥或腹滿實痛煩渴譫妄脈實數而沉裡熱燥甚腸胃怫鬱留飲不散胸腹高起痛不可忍但嘔冷液大渴反不能飲強飲不能止喘急悶者大黃半兩芒硝半兩厚朴半兩去皮枳實半兩上銼如麻豆大分半水一盞半生薑三片煎至六分內音納硝煎去滓服小承氣湯治傷寒日深恐有燥屎腹中轉失乃可攻之不轉失者必初硬後溏未可攻之攻之則腹滿不能食飲水而噦其後發熱大便復硬若腹大滿不通或陽明多汗津液外出腸胃燥熱大便必硬而譫語脈滑吐下微煩小便數大便結或下利譫語自得病二三日脈弱無太陽證柴胡證煩心心下結至四五日雖能食少少與承氣湯和之令小安大黃半兩厚朴三錢去皮枳實三錢上銼如麻豆大分作二服水一盞生薑三片煎至半盞絞汁服未利再服調胃承氣湯治諸發汗和解不惡寒但發熱蒸蒸然者或日深心下溫溫欲吐胸中痛大便溏腹滿鬱郁微煩先此時吐下者或日深裡熱譫語法當下之以銀粉巴豆燥熱大毒丸藥下之致真陰損虛邪熱轉甚因而協熱下利不止及表裡熱下之太早乘虛而入不成結胸但為熱利不止心下滿硬或痛煩渴咽乾脈滑數而實諸腹滿實痛者煩渴譫妄小便赤大便硬脈滑實緊大黃芒硝甘草各等分上銼如麻豆大分一半水一大盞煎至半盞絞去滓內芒硝煎不利再煎服三一承氣湯治傷寒雜病內外所傷日數遠近腹滿咽乾煩渴譫妄心下按之硬痛小便赤澀大便結滯或濕熱內甚而為滑泄熱甚喘咳悶亂驚悸狂顛目痛口瘡舌腫喉痹癰瘍陽明胃熱發斑脈沉可下者小兒熱極風驚潮搐宿喘昏塞並斑疹黑陷小便不通腹滿欲死或斑疹後熱不退久不作痂或作斑紋瘡癬久不已者怫熱內成疹癖堅積黃瘦痛疾久新卒暴心痛風痰酒隔腸垢積滯久壅風熱暴傷酒食煩心悶亂脈數沉實或腎水陰虛陽熱獨甚而僵仆卒中一切暴音不語一名失音蓄熱內甚陽厥極深脈反沉細欲絶或表之沖和正氣與邪熱並之於里則裡熱亢極陽極似陰反為寒戰脈微而絶或風熱燥甚客於下焦而大小便澀滯不通者或産婦死胎不下及兩感表裡熱甚須可下者大黃半兩錦紋芒硝半兩厚朴半兩去皮枳實半兩甘草一兩上銼如麻豆大水一盞半生薑三片煎至七分內硝煎二沸去滓服十棗湯治太陽中風下利嘔逆短氣不惡寒漐漐汗出發作有時頭痛心下痞硬引脅下痛兼下水腫腹脹並酒食積腸垢積滯痃癖堅積蓄熱暴痛瘧氣久不已或表之正氣與邪熱並甚於里熱極似陰反寒戰表氣入里陽厥極深脈微而絶並風熱燥甚結於下焦大小便不通實熱腰痛及小兒熱結乳癖積熱作發驚風潮搐斑疹熱毒不能了絶者大戟芫花慢火炒變色仲景鄉俗異語云炒作熬下凡言熬者皆乾炒也甘遂各等分上為末水一大盞棗十枚切開煮取汁半盞調半錢匕實人每一錢茵陳湯治陽明裡熱極甚煩渴熱鬱留飲不散以致濕熱相搏而身發黃疸但頭汗出身無汗小便不利渴引水漿身必發黃宜茵陳湯調下五苓散利大小便茵陳一名山茵陳一兩去莖大黃半兩大梔子七個色深堅實好者稍小者用十個上銼如麻豆大水二盞半慢火熬至一盞絞汁溫服以利為度甚者再作當下如爛魚肚及膿血膠膘等物及小便多出金色如皂莢汁或見證將發黃此一劑分作四服調五苓散三錢凡治發黃者無越此法妙桂苓甘露散一名桂苓白朮散一方甘草一兩半治傷寒中暑胃風飲食中外一切所傷傳受濕熱內甚頭痛口乾吐瀉煩渴小便赤澀大便急痛濕熱霍亂吐下腹滿痛悶及小兒吐瀉驚風茯苓一兩去皮甘草二兩炙白朮半兩澤瀉一兩桂半兩去皮石膏二兩寒水石二兩滑石四兩豬苓半兩上為末每服三錢溫湯調下新水亦得生薑湯尤良小兒每服一錢同上法此藥下神金丸止瀉利無不驗也並解內外諸邪所傷濕熱又一方卻不用豬苓或日三服不計時候梔子柏皮湯治頭微汗小便利而微發黃者濕熱相摶微者宜服黃柏半兩甘草一分大梔子十五個上銼如麻豆大水三盞煎至一盞絞汁分次作一日服之梔子豉湯治懊憹煩心及傷寒不得眠燥熱怫鬱結內而氣不宣通胸滿頭痛微汗虛煩大梔子七個銼碎豆豉半合俗言鹽豉上銼如麻豆大先以水二盞煮梔子至一盞半內豉煮至半盞絞汁溫服少氣者加甘草一分嘔者誤以丸藥下之者加生薑半兩或用溫湯濯手足使心胸結熱宣通而已凡加者皆用梔子先煮得吐止後服凡用梔子豉湯皆非吐人之藥以其燥熱鬱結之甚而藥頓攻之不能開通則發熱而嘔吐因其嘔吐發開鬱結則氣通津液宣行而已故不須再服也大陷胸湯治汗下之後不大便五六日舌乾而渴日晡潮熱從心至小腹脹滿而痛不可近脈當沉緊滑數或但胸結則無大段熱頭微汗出脈沉澀者水結也大黃三錢芒硝三錢甘遂末三字上銼如麻豆大分作二服每服水一盞煎大黃至六分內硝再煎一二沸絞汁調甘遂一字匕半溫服未快利再服勢惡不能利以意加服小陷胸湯治小結胸心下按之痛脈浮而滑無大段熱表未罷不可下之下之即死小結胸宜服半夏四錢湯洗全用不銼生薑二錢切黃連二錢銼栝蔞實大者半兩唯銼其殼子則不銼若銼其中子者非也上以水三盞煮栝蔞汁一盞半內藥煮至一盞絞汁分兩次溫服以效大陷胸丸治發熱而下之太早熱入因作結胸者項亦強如柔痓狀下之則和也大黃半兩芒硝一分杏仁十二個去皮尖雙仁草灰炒變色葶藶三錢微炒上大黃為末下葶藶杵羅研杏仁硝如泥和彈子大每服一丸入甘遂末三字白蜜半匙水一盞煮至半盞溫服當一宿許乃下未利再服梔子厚朴湯治傷寒下後心煩腹滿坐臥不安者大梔子七個枳實二錢厚朴半兩去皮炙上銼如麻豆大以水一盞半煮絞汁半盞溫服檳榔散治傷寒陰病下之太早成痞心下痞滿而不痛按之軟虛者檳榔枳殼等分上為末每服三錢煎黃連湯調下不計時候溫服大黃黃連瀉心湯治傷寒成病痞不已心腹亦實熱煩滿或譫妄而脈沉無他證者大黃黃連黃芩各一分上銼如麻豆大水二盞煎至一盞絞汁分三次溫服又一法加生薑一分甚良黃連解毒湯治傷寒雜病熱毒煩悶乾嘔口燥呻吟喘滿陽厥極深蓄熱內甚俗妄傳為陰毒者及汗下吐後寒涼諸藥不能退熱勢兩感證同法黃連去須黃柏黃芩大梔子各半兩上銼如麻豆大每服稱半兩水一茶盞煎至四分絞去滓溫服或腹滿嘔吐或欲作利者每服加半夏三個生全用厚朴二錢銼茯苓二錢去皮銼用水一盞半生薑三片煎至半盞絞汁溫服名半夏黃連解毒湯白虎湯加減白虎湯隨證用治傷風自汗桂枝證表未解半入於裡中暑自汗脈虛弱傷寒自汗脈滑數而實表裡俱熱三陽合病腹滿身重口燥面垢譫語發黃厥逆自汗和解兩感解頭痛止自汗雜病時疫未瀉發斑兼豆疱瘡疹伏熱知母一兩半甘草一兩炙粳米一合石膏四兩為末上銼如麻豆大抄五錢水一盞煎至六分去滓溫服無時候日三四服或眩咳嘔者加半夏半兩紅皮半兩每服生薑三片煎服傷寒發汗不解脈浮者加蒼朮半兩名蒼朮白虎湯汗吐下後煩渴口乾脈洪大加人參半兩名人參白虎湯賈同知已效方石膏四兩知母一兩甘草一兩劉庭瑞已效方知母一兩半石膏四兩粳米一合崔宣武已效方知母一兩石膏三兩甘草一兩半上為末每服三錢水一盞入粳米二十五粒煎至六分未曾下胃熱發斑兼痘疱如液虛瘦加人參半兩白朮半兩頭疼加川芎荊芥各三錢咳嗽加半夏三錢桔梗一兩恍惚加人參三錢茯苓半兩涼膈散一名連翹飲子亦有加減法治傷寒表不解半入於裡下證未全下後燥熱怫結於內煩心懊憹不得眠臟腑積熱煩渴頭昏唇焦咽燥喉閉目赤煩渴口舌生瘡咳唾稠黏譫語狂妄腸胃燥澀便溺閟結風熱壅滯瘡癬發斑驚風熱極黑陷將死連翹一兩山梔子半兩大黃半兩薄荷葉半兩黃芩半兩甘草一兩半朴硝一分上為末每服二錢水一盞蜜少許同煎至七分去滓溫服虛實加減咽喉痛涎嗽加桔梗一兩荊芥穗半兩嗽而嘔者加半夏半兩每服生薑三片同煎衄血嘔血加當歸半兩芍藥半兩生地黃一兩淋者加滑石四兩茯苓一兩去皮風眩加芎半兩石膏三兩防風半兩酒毒加葛根一兩荊芥穗半兩赤芍藥半兩芎半兩防風半兩桔梗半兩三歲小兒可服七八錢或惡熱甚黑陷腹滿喘急小便赤澀而將死者此一服更加大承氣湯約以下之立效凡言加者皆自本方加也以意加減退表熱加益元散效速人參石膏湯治傷寒咳嗽不已心煩及風熱頭痛精神不利昏憒宜服人參一錢半石膏三兩芎半兩半夏二錢去滑白朮半兩茯苓半兩甘草一兩炙大梔子三錢知母半兩黃芩三錢上為末每服一錢水一盞生薑三片煎至六分去滓溫服崔宣武人參石膏湯治傷寒頭痛心煩悶風熱並汗後餘熱自汗多清頭目定喘嗽人參二錢半石膏一兩芎二兩黃芩二錢茯苓三錢甘草半兩防風三錢上為細末每服五錢水一盞半煎至六分去滓溫服不計時候雙解散治風寒暑濕飢飽勞役內外諸邪所傷無問自汗汗後雜病但覺不快便可通解得愈小兒生瘡疹使利出快亦能氣通宣而愈益元散七兩防風通聖散七兩上二藥一處相和名為雙解散益元散方在痢門通聖散方在風門各七兩攪勻每服三錢水一盞半入蔥白五寸鹽豉五十粒生薑三片煎至一盞溫服白朮散治傷寒雜病一切吐瀉煩渴霍亂虛損氣弱保養衰老及治酒積嘔噦白朮茯苓去皮人參各半兩甘草一兩半炙木香一分藿香半兩葛根一兩上為末白湯調下二錢煩渴者加滑石二兩甚者加薑汁續續飲之四逆湯治傷寒表熱未入里誤以寒藥下之太早表熱不已入裡寒下利不止因表熱裡寒自利急以溫里利止又治少陰病脈沉下利厥逆煩渴嘔吐甘草一錢炙乾薑一分附子半個生去皮臍附子以半兩者佳小者力弱大者性惡非古方之宜也不但以美其大者要知古人之有則也上銼如麻豆大水二盞煎至一盞絞汁溫服或蓄熱深極而手足厥冷者不宜此方當以下之茯苓半夏湯治傷寒雜病一切嘔吐或喘咳疼痛痞滿頭痛者茯苓一分去皮半夏一錢生薑一分取汁上銼如麻豆大水一盞煎至四分絞汁下生薑汁溫服不計時候一方加黃芩一分去腐紅皮一分去穰治風痰
