body:
  text: 卷二諸證門伏梁證主心積出素問腹中論若梁之伏隱也居臍上逆臍下順不可移動為水溺澀故有二等鱉甲湯主之治伏梁積氣心下如臂痞痛不消小便不利鱉甲去裙欄醋炙黃色京三稜大腹子皮芍藥當歸柴胡去苗生地黃各一兩官桂生薑切作片子焙乾各三分上為末每服三錢水一大盞入生薑木香各半錢同煎至八分去滓空心溫服喑俳證主腎虛出素問脈解論內奪而厥舌喑不能言二足廢不為用腎脈虛弱其氣厥不至舌不仁經云喑俳足不履用聲音不出者地黃飲子主之治喑俳腎虛弱厥逆語聲不出足廢不用熟乾地黃巴戟去心山茱萸石斛肉蓯蓉酒浸焙附子炮五味子官桂白茯苓麥門冬去心菖蒲遠志去心各等分上為末每服三錢水一盞半生薑五片棗一枚薄荷少許同煎至八分不計時候厥逆證主心痛出素問腹中論膺腫頸痛胸滿腹脹上實下虛氣厥而逆陽氣有餘於胸也不可針灸宜服順氣湯小茯苓湯主之治厥逆病三焦不調升降胸膈膺腫胸滿腹脹冷氣衝注刺痛赤茯苓人參陳皮去白桔梗銼炒各等分上為末每服三錢水一盞半生薑五片同煎至八分去滓不計時候風成寒熱證主風出素問脈要精微論因於露風寒熱之始腠理次入胃食不化熱則消中寒栗振動也解風散主之治風成寒熱頭目昏眩肢體疼痛手足麻痹膈上壅滯人參川芎獨活麻黃去節湯洗焙各一兩甘草一兩細辛去苗半兩上為末每服三錢水一盞半生薑五片薄荷葉少許同煎至八分不計時候風成寒中證主風出素問風論風氣與陽明入胃循脈而上至目眥津液所生為泣也當歸湯主之治風邪所傷寒中目泣自出肌瘦泄汗不止當歸人參官桂各三錢乾薑炮白朮白茯苓甘草川芎白芍藥各半兩細辛去苗半兩陳皮一兩去白上為末每服三錢水一盞半生薑三片棗二枚同煎至八分去滓熱服不計時候並三服風成熱中證主風出素問風論風熱與陽明入胃循脈而上目眥肥人風氣不外泄為熱中目黃之病也青龍散主之治風氣邪傳化腹內瘀結而目黃風氣不得泄為熱中煩渴引飲地黃仙靈脾何首烏去黑皮泔浸一宿竹刀子切焙各一分防風去苗一分荊芥穗一兩上為末每服一錢沸湯點調下食後每日三服腦風證主風氣出素問風論風氣循風府而上則為腦風項背怯寒腦戶極冷以此為病神聖散主之治腦風邪氣留飲不散項背怯寒頭疼不可忍者麻黃去節細辛去苗乾蠍一半生一半炒藿香葉各等分上為末每服二錢煮荊芥薄荷酒調下茶也得並治血風又方治腦風邪氣留飲頭痛不可忍者用遠志末不以多少於鼻中㗜與痛處揉之相兼前藥可用也首風證主新沐中風出素問風論新沐中風為首風頭面多汗惡風當先一日甚至其風日則少愈大川芎丸主之治首風旋暈眩急外合陽氣風寒相搏胃膈痰飲偏正頭疼身拘倦川芎一斤天麻四兩用靳州者上為末煉蜜為丸每兩作十丸每服一丸細嚼茶酒下食後祕方茶酒調散治一切諸風痰壅目澀昏眩頭疼心憒煩熱皮膚病癢並風毒壅滯清爽神志通和關竅消惡汗石膏另為細末菊花細辛去苗香附子去須炒各等分上為末每服二錢溫茶酒調下食後日三服目風眼寒證主眼出素問風論風入系頭則血脈凝滯不能上下通流於目令風寒客之目風眼寒也石膏散主之治目風眼寒及偏正頭疼夾腦風鼻出清涕目淚疼痛不已石膏二兩炭火燒研細末川芎一兩甘草半兩炙上為末每服一錢蔥白好茶同煎湯調下食後日二服漏風證主酒風出素問風論飲酒中風或汗多不可單衣食則汗出多如液漏久不治為消渴疾白朮散主之治漏風久虛多汗食之汗出如洗少者痿劣牡蠣二錢焙赤白朮一兩一分防風二兩半上為末每服一錢溫水調下不計時如惡風倍防風白朮如汗多面腫倍牡蠣胃風證主風出素問風論因於失衣風感之頸多汗惡風膈塞不通寒則胃泄腹滿氣不通大豆蔻丸主之治胃風頸多汗惡風飲食不下小腹善滿失衣則腹脹食寒則泄形瘦肉豆蔻草豆蔻陳皮獨活意苡仁人參川芎各半兩羌活防風桔梗甘草炙木香分各上為末煉蜜為丸如桐子大每服四十丸米飲下不計時候日進三服胃風湯治風冷乘虛入客腸胃水穀不化腹脅虛滿㽲痛及腸胃泄毒或下瘀血人參白茯苓去皮芎藭官桂當歸去苗白芍藥白朮各等分上為末每服二錢水一大盞入粟米百餘粒同煎至七分去滓熱服空心食前此藥與大豆蔻丸為表裡也行痹證主痹出素問痹論風寒濕三氣合而為痹風氣勝者行痹上下左右無留隨所至作防風湯主之治行痹行走無定痹麻不快防風甘草當歸赤茯苓去皮杏仁去皮炒熟桂枝各一兩黃芩秦艽葛根各三錢麻黃半兩去節上為末每服五錢酒水合二盞棗三枚姜五片煎至一盞去滓溫服痛痹證主痹出素問痹論寒勝者為痛痹大宜宣通陰寒為痛宜通氣溫經而愈加減茯苓湯主之治痛痹四肢疼痛拘倦浮腫赤茯苓去皮桑白皮各二兩防風官桂川芎芍藥麻黃去節各一兩半上為末每服五錢水一盞棗一枚煎至八分去滓溫服以姜粥投之汗泄為度效矣著痹證主痹出素問痹論濕氣勝者為著痹濕地水氣甚重著而不去多汗而濡者茯苓川芎湯主之治著痹留注不去四肢麻拘攣浮腫赤茯苓桑白皮防風官桂川芎麻黃芍藥當歸甘草炙各等分上為末每服二錢水二盞棗三枚同煎至一盞去滓空心溫服如欲出汗以粥投之周痹證主痹出靈樞周痹黃帝針經云在血脈之中隨上下本痹不痛今能上下周身故以名之大豆糵散主之治周痹注五臟留滯胃中結聚益氣出毒潤皮毛補腎氣大豆糵一斤炒香熟上為末每服半錢溫酒調下空心加至一錢日三服胞痹證主膀胱出素問痹論小腹膀胱按之內痛若沃以湯澀於小便上為清涕太陽直行從巔入循於腦氣下灌於鼻時出清涕不止腎著湯主之治胞痹小便不利鼻出清涕者赤茯苓去皮白朮各四兩甘草三兩炙乾薑二兩炮上為末每服五錢水二盞煎至盞去滓溫服日三服腸痹證主痹出素問痹論雖多飲不得溲不成大便糟粕不化故氣喘急而飧泄木香丸主之治腸痹腹㽲痛時發飧泄氣不消化小便祕澀木香白朮官桂蕪荑良薑訶子皮各一兩附子炮去皮厚朴生薑制肉豆蔻各二兩乾薑三分甘草半兩上為末曲面糊為丸如桐子大每服二十丸薑湯下空心熱痹證主痹出素問痹論陽氣多陰氣少陽熱遭其陰寒故痹臟腑熱煽然而悶也升麻湯主之治熱痹肌肉熱極體上如鼠走唇口反縱皮色變兼諸風皆治升麻三兩茯神去皮人參防風犀角鎊羚羊角鎊羌活各一兩官桂半兩上為末每服四錢水二盞生薑二塊碎竹瀝小許同煎至一盞溫服不計時候白淫證主虛勞出素問痿論思想無窮所願不得意淫於外入房太甚斤縱發為斤痿及為白淫太過者白物為淫隨溲而下故為勞弱祕真丸主之治白淫小便不止精氣不固及有餘瀝或夢寐陰人通泄耳龍骨一兩另研訶子皮五個用大者縮砂仁半兩去皮硃砂一兩研細一分為衣上為末麵糊為丸如緑豆大每服一丸空心溫酒下冷水亦得不可多服大便祕蔥白湯茶下胃脘癰證主癰出素問病能論胃脈沉細陽氣不得下通寒癰陽熱聚於胃口腐壞成膿射干湯主之治胃脘癰人迎脈逆而甚嗽膿血營衛不流熱聚胃口成癰射干去毛梔子仁赤茯苓去皮升麻各一兩赤芍藥一兩半白朮半兩上為末每服五錢水二盞煎至一盞去滓入地黃汁一合蜜半合再煎溫服不計時候陽厥證主諸氣出素問病能論怒狂者生於陽也陽勝則氣逆狂怒上氣奪食即已食入陰善於陽則平其氣若陽勝氣逆多怒羚羊角湯主之治陽厥氣逆多怒而頸脈復動已食陰養於陽平其氣羚羊角人參各三兩赤茯苓二兩去皮遠志去心大黃炒各半兩甘草一分炙上為末每服三錢水一盞煎至八分去滓溫服不計時候新補又方治陽厥若除煩下氣鐵落為飲鐵漿湯飲之食後並服息積證主心腹出素問奇病論病脅下滿逆氣不已氣逆脅下息而不消積而不散氣元在胃妨飲食不可針灸宜導引服藥爾白朮丸治息積脅下氣逆妨悶喘息不便呼吸引痛不已白朮枳實官桂各一兩半人參二兩陳皮桔梗醋炒甘草各一錢上為末煉蜜為丸如桐子大每服二十丸溫酒下日三服疢斤證主肝出素問奇病論人有尺脈數甚斤急而見腹必急數亦為虛斤見以名耳柏子仁散主之治疢斤肝虛生寒脈數徑急腹脅痞悶斤見於外聖惠方中十五味柏子仁丸亦治柏子仁茯苓防風細辛白朮官桂枳殼川芎各三兩附子當歸檳榔各半兩上為末每服三錢水一盞半生薑三片棗二枚同煎至八分去滓溫服不計時候厥逆頭痛證主腎出素問奇病論腎虛犯大寒頭痛齒亦痛痛之甚數歲不已者是也以天南星丸主之治厥逆頭痛齒痛骨寒胃脈同腎脈厥逆頭痛不可忍之天南星炮硫黃研石膏研消石研各等分上為末麵糊為丸如桐子大每服二十丸溫酒下空心日午臨臥三時服膽疸證主肝出素問奇病論謀慮不決膽虛氣上衝口中上溢則口苦是清淨之府肝濁擾之氣上溢益膽湯主之治膽疸膽虛熱氣上衝口中當苦泄熱不已臟腑固虛致然黃芩去朽甘草炙人參各二兩官桂一兩苦參茯神各兩半上為末每服三錢水一盞煎至八分去滓溫服不計時候濡泄證主利出素問氣交變大論內經云濕勝則濡泄甲乙經云寒客生濡胃泄如隨氣而下利豆蔻散主之治濡泄不止寒客於脾胃故傷濕而腹痛滑利不止肉豆蔻五個甘草炙厚朴各等分上為末每服二錢米飲一盞調下食前白湯亦得鶩溏證主利出素問氣交變大論脾虛風冷陰盛糟粕不化大便黃黑如鶩溏或大腸有寒也吳茱萸丸治鶩溏瀉泄不止脾虛胃弱大腸有寒大便青黑或黃利下吳茱萸湯洗炒乾薑赤石脂陳曲炒熟當歸焙厚朴各三錢上為末煉蜜為丸如桐子大每服三十丸溫米飲下空心服三焦約證主大小腸出素問宣明五氣論小腹痛不得大小便邪氣入客約而不行故穀氣不得通也枳殼丸主之治三焦約調順三焦氣脈消痞滯利胸膈治風通大小便陳皮一兩檳榔半兩牽牛四兩一半生一半熟搗取頭末一兩半余不用木香一分枳殼二兩上為末煉蜜為丸如桐子大每服十五丸生薑湯下食後日三服胃寒腸熱證主胃出素問五臟別論胃寒不受水穀不化瀉泄寒之氣在上腸熱之氣在下故脹而泄妙應丸主之治胃寒腸熱水穀不化腹脹痞滿泄利不已川烏頭去尖半兩梔子仁乾薑生各一分上為末生薑汁麵糊為九如桐子大每服五丸溫酒下食前日進二服胃熱腸寒證主胃出素問五臟別論胃熱則消穀善食而飢奈腸寒則血凝脈重小腹疼痛而脹青橘皮丸又云前胡木香散亦治飢治胃熱腸寒善食而飢便溺少而腹脹痛大便或澀青皮京三稜黃連蓬莪朮炮各一兩巴豆霜一分上為末麵糊為丸如緑豆大每服三丸至九丸茶酒下食後少與之不可多也控睪證主小腸出素問至真要大論甲乙經云小腸病結於腰上而不下痛衝心肺邪所繫茴香楝實丸主之治小腸病結上而不下痛衝心肺茴香炒楝實麩炒去核吳茱萸馬練花醋炒各一兩陳皮一兩芫花半兩醋炒上為末醋麵糊為丸如桐子大每服十丸至二十丸溫酒下空心食前陰疝證主男病出素問至真要大論足厥陰之脈環陰器抵小腹小腹痛或腫腎虛寒水涸竭瀉邪補脈為治蒺藜湯主之治陰疝牽引小腹痛諸厥疝即陰疝也欲勞痛不可忍之蒺藜去角炒附子炮去皮臍梔子各一兩上為末每服二錢水一盞半煎至六分去滓每日三服控睪證茴香練實丸亦治此證諸痹證主風出素問痹論痹乃風寒濕三氣相合而為痹風者百疾之長善行數變多汗惡風目瞤脅痛或走注四肢皮膚不仁屈伸不便升麻前胡湯主之治肝風虛所中頭痛目眩胸膈壅滯心煩痛昏悶屈伸不便升麻前故各一兩半玄參地骨皮各一兩羚羊角葛根各二兩酸棗仁一錢上為末每服三錢水一盞半煎至八分去滓再煎三五沸食後溫服如行五六里更進一服心疝證主心痛出素問脈要精微論心脈急小腹有形心不受邪必傳於府故小腹有形心氣逆不順當痛不已當兼心氣治不止為有寒邪所中木香散主之治心疝小腹痛悶絶不已者木香陳皮各一兩良薑乾薑訶子皮赤芍藥枳實各半兩草豆蔻黑牽牛各三兩川芎三兩上為末每服二錢水一盞煎至七分去滓溫服四聖散治腎藏風並一切癬白附子白蒺藜黃耆羌活各等分生用上為末每服二錢湯調下空心一日三服久癬不瘥十日大愈赴筵散治口瘡不已者密陀僧黃柏青黛各等分上同研為細末每用干糝於瘡上不過三二日即便愈訶子湯治失音不能言語者訶子四個半炮半生桔梗一兩半炙半生甘草二寸半炙半生上為細末每服二錢同童子小便一盞同水一盞煎至五七沸溫服甚者不過三服即愈
