body:
  text: 卷十二補養門補養總論素問云諸寒收引皆屬於腎腎者少陰也少陰者至陰也至者為極也少陰者冬脈所旺居北而屬水為寒為歸藏為周密寒中收引拘縮寒之用也其病上下所生水液澄徹冷清者不濁其氣寒冷水穀不消化吐利清冷為病則如天氣寒而水自清也素問云太陽受寒血凝為瘦太陰受寒氣聚為疝但脈急而寒之象也急主於痛故緊急也內經云數則為熱遲則為寒諸陽為熱諸陰為寒脈當遲緩寒毒內郁洪數為熱所養心之脈也寒氣生清水清就於濕故以下利清白此乃腸胃寒化物失常熱則壅澀不通寒勝則火衰火衰金旺吐利腥穢四肢逆冷堅痞腹滿屈伸不便禁固戰栗謂陰水主之舒捲不便診其脈沉伏而遲病之證也若身涼不渴而寒蜷足而臥惡聞人聲不欲言皆陰證也陰陽停則和偏則病如陽氣暴絶陰氣獨勝則為寒證陰氣暴絶陽氣獨勝則為熱證經曰陽勝陰虛汗之而死陰勝陽虛下之而死若陽實外熱陰虛內寒陰實內熱陰虛外寒陽實伐其陽當涼膈散承氣湯主之陰實伐其陰當白朮散四逆湯主之論曰大凡治病必求標本受先者為本次者為標此為兼證故知逆與從正行無問知標本者萬舉萬當不知標本者是謂妄行也本病相傳先治其急六氣為本三陰三陽為標故病氣為本受病經絡臟腑謂之標也防風當歸飲子治脾腎真陰損虛肝心風熱鬱甚陽勝陰衰邪氣上逆上實下虛怯弱不耐或表熱而身熱惡寒或裡熱而躁熱煩渴或邪熱半在表半在裡進退出入不已而為寒熱往來或表多則惡寒里多則發熱或表之陽分陽和正氣與邪相助並甚於里蓄熱極深而外無陽氣裡熱極甚陽極似陰而寒戰腹滿煩渴者或里之陰分不和正氣反助邪氣並甚於表則躁熱煩渴而汗出也或邪熱壅塞者或煩熱痛者或熱結極甚陽氣不通而反覺冷痛或中外熱鬱煩躁甚喜涼畏熱者或熱極悶塞不得宣通陽極似陰中外喜熱而反畏寒者或寒鬱胸中而煩渴熱極甚而腹滿不消者或一切風熱壅滯頭目昏眩暗風眼黑偏正頭疼口乾鼻塞耳鳴及聾咽嗌不利或目赤腫痛口瘡舌痹或上氣痰嗽心脅郁痞腸胃燥澀小便溺淋閟或是皮膚瘙癢手足麻痹又或筋脈拘急肢體倦怠或渾身肌肉跳動心忪驚悸或口眼喎斜語言謇澀或狂妄昏惑健忘失志及或腸胃燥熱怫鬱而飢不欲食或濕熱內余而消穀善飢然能食而反瘦弱或誤服燥熱毒藥及妄食熱物過多而耗損脾腎則風熱鬱甚而多有如此不必全見也無問自病及中燥熱毒藥所使者並宜宣通氣血調順飲食久服之舊病除去新病不生設虛人常服補益功驗自可知矣當歸大黃柴胡人參黃芩甘草炙芍藥各一兩滑石六兩上停每服三錢至五錢水一大盞生薑三片同煎至七分去滓溫服雙芝丸補精氣填骨髓壯筋骨助五臟調六腑久服注顏不老熟乾地黃焙取末石斛去根酒炙五味子焙黃耆銼肉蓯蓉酒浸牛膝酒浸杜仲蜜水浸炮菟絲子酒浸三日炒麋鹿角霜半斤沉香三錢麝香二錢研人參白茯苓去皮覆盆子乾山藥木瓜天麻酒浸秦艽以上各一兩薏苡仁二兩炒上為末煉蜜為丸如桐子大每服二十丸至三四十丸溫酒下鹽湯米飲亦可凡年五十以上加入黑附子以青鹽湯蘸泡鹿角二大對去頂三指硫黃半斤渾用以上用些油釜中以水同煮令微沸勿太急甚水耗只旋添溫水須用水以備添也煉令角膠汁出盡其角如霜以手捻如膩紛乃盛之取用勿令穢汙也內固丹補養腎氣調和脾臟壽高者常服筋骨徑健渾如壯士肉蓯蓉酒浸茴香炒各一兩破故紙胡蘆巴炒巴戟去心黑附子炮川楝子胡桃仁麵炒各四兩上為末研胡桃仁為膏余藥末和勻酒麵糊為丸如桐子大每服十丸至三十丸溫酒鹽湯下食前虛者加至五七十丸此藥明目補腎烏髮進美食空心大補丸治男子脾腎不足不問久新者陳韭子揀蘿蔔子以上炒蕤仁去皮各半兩穿山甲七片用酒炙麝香少許上為細末煉蜜為丸如櫻桃大每服一丸溫酒送下食前空心蛤蚧散治脾胃氣攻心刺痛者蛤蚧一對酒炙乳香木香白茯苓去皮丁香茴香各一錢穿山甲二錢酒炙上為細末每服一錢好溫酒調下空心食前金鎖丹治男子本臟虛冷夜夢鬼交者龍骨水飛菟絲子各一兩破故紙韭子澤瀉牡蠣各半兩麝香少許上為末酒麵糊為丸如桐子大每服三十丸溫酒下空心食前日三服調中丸治脾胃虛止嘔吐寬利胸膈青皮紅皮各一兩大黃二兩牽牛三兩上為細末滴水和丸如桐子大每服三二十丸溫水下空心食前水中金丹治元臟氣虛不足夢寐陰人走失精氣陽起石研木香乳香研青鹽各二分茴香炒骨碎補炒杜仲去皮生薑汁炙絲盡各半兩白龍骨一兩緊者捶碎絹袋盛大豆蒸熟取出焙乾黃犬腎一對酒一升煮熟切作片子焙入白茯苓一兩與腎為末上為細末酒麵糊和丸如皂子大每服二丸溫酒下空心忌房室和氣地黃湯治沉積氣結不散調養營衛補順陰陽常服以代湯茶酒果木香一字揀桂去皮茯苓去皮白芥子炒香各一錢白朮乾山藥川芎當歸焙各一分桂花縮砂仁各半錢甘草半兩炙上為細末入麝香少許研勻用數重油紙或瓷器內密封起每用蜜二斤餳飴一斤溫好甜水五升化勻開抄前藥並杏仁十枚去皮尖洗淨炒香焦捶碎濕地黃根長約寸許切取汁半盞溫服白朮調中湯治中寒痞悶急痛寒濕相搏吐瀉腹痛上下所出水液澄徹清冷穀不化小便清白不澀身涼不渴本末不經有見陽熱證其脈遲者是也此因飲食冷物過多陰勝陽衰而為寒也或冷熱相擊而反陽氣怫鬱不能宣散怫熱內作以成熱證者不可亦言為冷當以脈證別之夫濕熱吐瀉常見陽脈若亡液氣虛亦能反見諸陰脈也當以標本之不同別之或熱證誤服此白朮調中湯溫藥也能開發陽氣宣通而愈別無加害無問久新並宜服之或有口瘡目疾孕婦等吐瀉者以畏乾薑官桂不服白朮茯苓去皮紅皮去白澤瀉各半兩乾薑炮官桂去皮縮砂仁藿香各一分甘草一兩上為末白湯化蜜少許調下三錢每日三服煉蜜和就每兩作十丸名白朮調中丸小兒一服分三服人參白朮散此方證同調中湯人參白朮茯苓甘草橘皮葛根澤瀉滑石霍香各等分上為末每服三錢水一盞煎至六分溫服妊婦加蒼朮三五片熱服白朮散治傷寒下後餘熱以藥下之太過胃中虛熱飲水無力也當生胃中津液多服此藥人參白朮木香白茯苓甘草銼炙藿香葉乾葛銼各一兩上為末每服一錢至二錢水一盞煎至五分溫服如飲水者多煎與之無時也丁香附子散治脾胃虛弱胸膈痞結吐逆不止附子一兩母丁香四十九個生薑半斤取自然汁半碗上用附子鑽孔四十九以丁香䖆上而填內將生薑汁用文武火熬盡又用大蘿蔔一個取一穴子入附子又填內將蘿蔔蓋之又用文武桑柴火燒香熟為度取出切附子作片子焙乾搗為細末每服一錢米湯一盞調下日進三服何首烏丸治男子元臟虛損填精發白再黑何首烏半斤肉蓯蓉六兩牛膝四兩上將何首烏半斤用棗一層隔何首烏甑內蒸棗軟用切焙同為末棗肉和丸如桐子大每服五七丸嚼馬楝子服酒送食前一服加一丸日三服至四十丸即止卻減丸數效如神妙煨腎丸治男子腰膝痛夜多小便者川楝子馬楝花破故紙胡蘆巴茴香炒各等分上除茴香外四味酒浸同為末煮麵糊為丸如桐子大每服十丸至二十丸溫酒下空心食前神仙楮實丸治積冷氣衝心胸及背有蛔蟲疼痛痔瘻痃癖氣塊心腹脹滿兩肋氣急食不消化上逆氣奔於心並疝氣下墜飲食不得吐水嘔逆上氣咳嗽眼花少力心虛健忘冷風遍風等疾坐則思睡起則頭眩男子冷氣腰痛膝痛冷痹風頑陰汗盜汗夜多小便泄利陽道衰弱婦人月水不通小便冷痛赤白帶下一切冷疾無問大小能明目益力輕身補髓益精楮實子一升涮去泥微炒官桂四兩去皮牛膝半斤酒浸三日乾薑三兩炮上為末酒麵糊為丸如桐子大每服二十丸溫酒空心食前鹽湯亦得補中丸治一切氣疾肚腹涼痛嘔吐氣逆不思飲食者厚朴生薑炙香乾薑炮源木白茯苓去皮人參甘草炙用各等分上為末煉蜜為丸如櫻桃大每服一丸空心白湯化下細嚼亦得蓽澄茄丸治中焦痞塞氣逆上攻心腹㽱痛吐逆美飲食蓽澄茄半兩良薑二兩神麯炒青皮去白官桂去皮各一兩阿魏半兩醋麵裹煨熟上為末醋麵糊為丸如桐子大每服二十丸生薑湯下不計時候
