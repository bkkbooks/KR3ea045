body:
  text: 卷十五雜病門瘡疹總論索問云痛癢瘡瘍癰疽瘍疹瘤氣結核怫鬱甚者皆熱五臟不和九竅不通六腑不和留結為癰近於火氣微熱則癢熱甚則痛附近則灼而為瘡皆火之用也人之瘡腫因內熱外虛所生也為風濕之所乘則生瘡腫然肺主氣候於皮毛脾主肌肉氣虛則膚腠開為風濕所乘脾氣溫而內熱即生瘡也腫者皆由寒熱毒氣客於經絡使血澀而不通壅結成腫風邪內作即無頭無根氣血相搏作者即有頭有根熱壅盛則為膿赤核腫則風氣流結也瘡以痛癢痛則為實癢則為虛非謂虛寒也正謂熱之微甚也癢者美疾也故火旺於夏而萬物蕃鮮榮美也炙之以火漬之以湯而其癢轉甚者微熱之所使也癢去者謂火熱令皮膚縱緩腠理開通陽氣得泄熱散而去或夏熱皮膚癢而以冷水沃之其癢不去謂寒收斂腠理閉密陽氣鬱結不能散越怫熱內作故也瘡瘍皆為火熱而反腐出膿水者猶穀肉果菜熱極則腐爛而潰為汙水也漬而腐爛者水之化也癰淺而大疽深而惡熱盛血則為癰膿也瘍有頭小瘡也疹浮而小癮疹也瘤氣赤瘤丹熛熱盛氣火之色也如意散治疥癬無時痛癢愈發有時不問久新者吳茱萸牛蒡子荊芥各一分牡蠣半兩輕粉半錢信砒二錢上為細末研勻每臨臥抄一錢油調遍身搓摩上一半如後有癢不止更少許塗之股髀之間聞香悉愈信效散治風熱上客陽明之經牙齒疳蝕斷宣腐臭血出色黃氣腐注悶動搖疼痛發作有時兼解中金石一切毒藥信砒一錢黃丹二錢千古石灰如無但以陳者炒細研四錢上為細末入青鹽一分麝香少許如無此二味亦得每上抄三兩大豆許先洗漱淨以手蘸藥捺上下牙齒齦瀝涎勿咽之須臾漱淨或有蝕處再上少許日三四次常用如意一上以頻為妙或服金石藥致病使一日三四上更不傷牙齒如神或已傷牙齒者敷之即愈或平人常用頗能清利頭目寬膈美食使髭鬚遲白久用亦能固牙齒使遲老人氣於面而手足陽明氣血灌注憂思則氣結而血液不行燥熱怫鬱而血衰不能榮養臟腑故早蒼黃而斑白也此藥能使陽明血氣宣通故效能然也又方使龍骨不用石灰神聖餅子治一切打撲傷損金石刀刃出血不止者立效烏魚骨一兩五月五日前先準備下萵苣菜一握韭菜一握青薊草一握約一虎口人手取團丸是也石灰四兩上以五月五日日未出本人不語將取三味同杵爛次後下余藥味杵得所搏作餅子曬乾用時旋刮敷之此藥上無膿退痂便愈芙蓉膏治遍滿頭面大小諸靨子或身體者料炭灰桑柴灰蕎麥點灰各半升上灰用熱湯淋取一升熬至五分獨角仙一個不用角紅娘子半錢不去翅足糯米四十九粒石灰一兩風化者上為末將前項灰汁調如麵糊相似在瓷合子內於土底埋五七日取出使用取瘢痕靨內刺破用細竹籤子點之放藥用濕紙揩藥再點至三上見瘢痕時冷水淋洗忌薑醋魚馬肉鉛白霜散治大小人口瘡牙齒腐蝕氣臭出血者鉛白霜二錢銅緑二錢白礬一塊指大許上為末以翎羽掃瘡上以溫漿水漱之麝香散治大小人口齒腐蝕出血斷根宣爛者上好鹹土不以多少麝香真好者少許上土熱湯淋取汁去滓用清汁銀石器中熬干刮下再與麝香同研勻摻於瘡上以紙貼神效乳香散治一切瘰癧瘡新久遠近不已者乳香一錢砒霜一錢硇砂一錢半紅娘子十四個去翅足黃丹半錢上為末糯米粥和作餅子如折三錢厚小銅錢裹卷大破瘡上白麵糊如不破音灸柴炷大者不過一日其瘰癧核自下五香湯治一切惡瘡瘰癧結核無頭尾及諸瘡腫沉香木香雞舌香各一兩熏陸香麝香各三錢連翹一兩半上研為細末每服二錢水一盞煎至六分不拘時服紫參丸治熱毒瘰癧腫痛已肉消瘡已破出膿水服此紫參苦參銼各一兩連翹二兩丹參一兩半膩粉二錢別研滑石二兩上為末別用玄參一斤搗碎以酒三碗浸三日揉取汁去滓用皂角子三百枚煨熟搗為末用玄參酒熬皂角子末成膏和前藥如桐子大每服一丸以黃耆湯下一日加一丸至患人歲數即止如四十則二十每日卻減一丸瘡自干有結肉消麝香雄黃散治十七般惡蟲咬傷人及瘡腫者麝香雄黃乳香硇砂各二錢土蜂窩露蜂窩燒灰各一個上研為細末以醋調少許塗咬著處或不辨認得多疑是惡瘡三五日不療即毒入心難瘥忌雞血油膩物硇砂散治一切疔瘡硇砂雄黃天南星砒霜各等分麝香少許上研為末用竹針針開用藥到黃水出瘡已聖力散治諸疔瘡腫草烏頭白芨白蘞木鱉子去皮地龍金毛狗脊各二錢半麝香三錢黃丹少許上為細末用針針到生肉痛者用藥黃水出為度穿山甲散治一切通氣破瘡腫行膿血如神妙穿山甲木鱉子烏龍角各等分都燒存性上為末每服一錢半空心熱酒調下至中午瘡破膿血便行守癭丸治癭瘤結硬通草二兩杏仁一大合去皮尖研牛蒂子一合出油吳射干昆布去咸訶黎勒海藻去咸各四兩上為末煉蜜為丸如彈子大含化咽津下日進三服鬼代丹治打著不痛無名異研沒藥研乳香研自然銅醋淬研地龍去土木鱉子去殼各等分上為末煉蜜為丸如彈子大溫酒下一丸龍腦潤肌散治杖瘡熱毒疼痛黃丹一兩密他僧半兩輕粉一錢半麝香半兩龍腦一字上為末摻藥在瘡上用青帛子覆之內留一眼子香藥丸治瘰癧瘡硇砂乳香沒藥半夏輕粉赤石脂各等分上為末糯米粉為丸如桐子大每服十丸加至二十丸皂角子湯下臨臥紅玉梃子治一切牙疳砒霜一塊皂角子大黃丹煆過滷土各等分上為細末糊餅和作劑子任牙桃花散治一切瘡生肌藥白芨白蘞黃柏黃連乳香別研麝香別研黃丹各等分上為細末摻於瘡上三二日生肌肉滿追毒散治生瘡發悶吐逆霍亂螺兒青揀甘草各一兩白礬二錢半上為細末每服一錢新汲水調下立止膽礬丸治男子年少而鬢髮斑白土馬綜燒存性胡桃十個真膽礬半兩川五倍子一兩上為末和作一塊絹袋子盛如彈子大熱酒水各少許浸下藥汁淋洗頭髮一月神效茯神散治膽熱多睡神思不安昏悶茯神去皮麥門冬地骨皮茯苓各一兩白蘚皮酸棗仁沙參甘草炙各半兩上為末每服三錢水一盞煎至六分去滓食後服鐵腳丸治大小便不通皂角不以多少去皮去殼子炙上為末酒麵糊為丸如桐子大每服三十丸酒下金聖散治小腸膀胱氣痛不可忍者地膽半兩去足翅微炒滑石一兩硃砂半錢上為末每服二錢用苦杖酒調下食前服琥珀散治五淋滑石二兩木通當歸木香鬱金扁竹各一兩琥珀二兩上為末每服三五錢用蘆葦葉同煎食後日三服葵子散治小便不通葵子茯苓去黑皮各等分上為末每服四錢水一盞煎二沸食前倒換散治無問久新癃閉不通少腹急痛肛門腫痛大黃小便不通減半荊芥穗大便不通減半各等分上件藥味各別為末每服一二錢溫水調下臨時加減服敗毒散治男子往來寒熱婦人産後骨蒸血運大黃黃藥子紫河車赤芍藥甘草各等分上為末每服一錢如發熱冷水下如發寒煎生薑栝蔞湯乘熱調下此藥偏治婦人補真丹治男子元藏虛冷興陽固腎補虛黑附子一兩煨陽起石火燒酒淬三錢海馬二錢乳香雄黃為衣血竭各三錢石蓮子去殼皮心黑錫炒去砂子半兩石燕子燒以醋淬麝香一分上為細末麵糊為丸每服二十丸用五香湯空心下五香湯調神益氣沈香箋香乳香麝香檀香各等分上為細末每服半錢煎湯下新添一醉烏法治頭須白再黑方訶黎勒十個不去核酸石榴三個大者取汁緑礬五分生地黃汁一升硇砂研硫黃研各一錢上藥同入瓷瓶內用二味汁浸密封勿令透氣至四十九日後取出其訶子狀若黑梅至夜臨臥含一枚咽津到曉爛嚼以酒一盞下之三二日後再服忌蔥大蒜蘿蔔
